# Black Sea RoBg scenario grid, input version v6.1 (v6 of 2026-11-21 plus the corrections of 2026-11-22).
#
# tools/scenarios_build.py --grid internal_analysis/scenarios/scenario_grid_v6.yaml turns this file
# into epm/input/data_blacksea/scenarios_v6.csv. A run reads it with
#     python epm.py --folder_input data_blacksea --scenarios scenarios_v6.csv -S Int_Base_5y --cpu 1
#
# The v5 grid (scenario_grid.yaml, scenarios.csv) is frozen and stays as published. This file holds
# the v6 inputs while they are built, edit by edit, by pre-analysis/pipelines/build_robg_v6.py.
# Same rules as the v5 grid: scenario name = Scope_Case[_Sensitivity]_Grid, each column is the
# reference overlaid by its grid, its scope, its case and its sensitivity; a value is a file path
# relative to the data folder; {g} is the grid token.
#
# State on 2026-11-21: edits 1 to 8 are in the grid. Reference: border prices, fuel and CO2, border
# limits on TYNDP 2026 and the TSO plan; Hungary as a modelled zone; Bulgarian and Armenian fleets.
# Project cases: line files written by pre-analysis/pipelines/build_cases_v6.py. Ext scope, its
# case variants and its EU price cases: derived by tools/build_ext_inputs_v6.py. The other
# sensitivities come with their v6 files.
#
# State on 2026-11-22, input version v6.1: twelve corrections applied inside the v6 builds (edit 9 of
# build_robg_v6.py), so the files keep their names. The inputs of 21 November are the earlier version
# of the data folder (epm/input/data_blacksea.dvc at f6367a3a) and their results stay in the explorer
# runs named v6_*. The results of this version go to the explorer runs named v61_*. Added with the
# corrections: the case NoCTN and three sensitivities of the Int scope, on the five-year grid only.

data_folder: epm/input/data_blacksea
archive: scenarios_archive.csv
output: scenarios_v6.csv
report: internal_analysis/scenarios/scenario_grid_v6_report.md
input_version: v6.1

# Run register (tools/scenario_register.py --grid <this file>). The scenarios keep their names
# across input versions, so the register reads its results only from the explorer runs named
# v61_*, and shows as twin the most recent result of the same name in the other runs: the v6 runs
# of 21 November where they exist, else the v5 grid.
register: internal_analysis/scenarios/scenario_register_v6.csv
result_runs: "v61_*"
twin: same_name

# Int_Base. Against the v5 reference: every zone indexed input carries Hungary (suffix _v6), and
# six rows left to config.csv in v5 are now named because their v6 file holds the Hungarian rows
# (demand profile, renewable profiles, availability, the three default tables).
# Unchanged from v5: the custom capex trajectories (indexed by plant), the fuel limits (Georgia
# and Bulgaria only) and the technology and fuel list.
reference:
  zcmap: zcmap_robg_v6.csv
  pDemandProfile: load/pDemandProfile_v6.csv
  pDemandForecast: load/pDemandForecast_v6.csv
  pGenDataInput: supply/pGenDataInput_v6_{g}.csv
  pGenDataInputDefault: supply/pGenDataInputDefault_v6.csv
  pAvailability: supply/pAvailabilityCustom_v6.csv
  pAvailabilityDefault: supply/pAvailabilityDefault_v6.csv
  pCapexTrajectories: supply/pCapexTrajectoriesCustom_v2.csv
  pCapexTrajectoriesDefault: supply/pCapexTrajectoriesDefault_v6.csv
  pFuelPrice: supply/pFuelPrice_robg_v6.csv
  pVREProfile: supply/pVREProfile_v6.csv
  pStorageDataInput: supply/pStorageDataInput_v6_{g}.csv
  pPlanningReserveMargin: reserve/pPlanningReserveMargin_robg_v6.csv
  pMaxFuellimit: constraint/pMaxFuellimit_robg.csv
  zext: trade/zext_robg_v6.csv
  pExtTransferLimit: trade/pExtTransferLimit_robg_v6.csv
  pLossFactorInternal: trade/pLossFactorInternal_robg_hvdc_v6.csv
  pMaxAnnualExternalTradeShare: trade/pMaxAnnualExternalTradeShare_robg_v6.csv
  pTradePrice: trade/pTradePrice_robg_v6.csv
  pTradePriceExport: trade/pTradePriceExport_robg_v6.csv
  # Base limits: the border limits of edit 3 plus the committed Georgia to Armenia line (CTN). No
  # line is in service on that pair before CTN (rule of the study, corrections of 2026-11-22).
  pTransferLimit: trade/pTransferLimit_robg_base_hvdc_v6.csv
  # Candidate table of the forced cases: no line can be built. Against the v5 table, the mainland
  # Azerbaijan to Nakhchivan line is no longer committed: it is segment 1 of the TRIPP row.
  pNewTransmission: trade/pNewTransmission_none_v6.csv
  pTechFuel: supply/pTechFuel_robg.csv

# Grids, as in v5.
grids:
  5y:
    token: s5
    label: "2025, 2030, 2032, 2036, 2040 (fast lane)"
    y: y_s5.csv
    cplexfile: cplex/cplex_s5.opt
  2y:
    token: 2y
    label: "2025, then every second year to 2040 (when there is time)"
    y: y_2y.csv
    cplexfile: null

# Scopes. Int: Romania, Bulgaria and Hungary modelled. Ext is derived from Int by
# tools/build_ext_inputs_v6.py: the three leave the zone map, Romania and Bulgaria come back as
# price zones at the EU central price (TYNDP 2026), Hungary disappears with the borders only the
# three reached. Twelve zone indexed inputs get an _ext_v6 twin; the fuel limit has no v6 source
# and keeps its v5 Ext file. Everything else is shared with Int.
scopes:
  Int:
    label: "Romania, Bulgaria and Hungary modelled"
    cases: [Base, BSSC, GECO, Onland, EWTC, TRIPP, TCasp, BSTN, ArTur, ArAz, AllProjects, FreeExp, NoCTN]
    overrides: {}
  Ext:
    label: "Romania and Bulgaria as price zones"
    cases: [Base, BSSC, GECO, Onland, FreeExp]
    overrides:
      zcmap: zcmap_ext_v6.csv
      pGenDataInput: supply/pGenDataInput_v6_{g}_ext.csv
      pStorageDataInput: supply/pStorageDataInput_v6_{g}_ext.csv
      pFuelPrice: supply/pFuelPrice_ext_v6.csv
      pPlanningReserveMargin: reserve/pPlanningReserveMargin_ext_v6.csv
      pMaxFuellimit: constraint/pMaxFuellimit_ext.csv
      zext: trade/zext_ext_v6.csv
      pExtTransferLimit: trade/pExtTransferLimit_ext_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_ext_v6.csv
      pMaxAnnualExternalTradeShare: trade/pMaxAnnualExternalTradeShare_ext_v6.csv
      pTradePrice: trade/pTradePrice_ext_v6.csv
      pTradePriceExport: trade/pTradePriceExport_ext_v6.csv
      pTransferLimit: trade/pTransferLimit_ext_v6.csv

# Cases: one row of the scenario matrix each. A forced case carries its project in the line limits
# from the start year of the project, on top of the Base, with its capex outside the objective
# (net benefit ex post, capex_interconnectors_expost_v6.csv). The first model year at or after the
# start year is the year the model sees. Sizes and years: internal_analysis/scenarios/cases_v6_report.md.
# The sizes and years of the two Armenian lines come from the country team table and are not
# written here. GECO, AllProjects and FreeExp use the zone map that holds the two hubs of the
# Caucasus, whose renewable plants are candidates. FreeExp forces nothing: every line of the rows
# above is a candidate sized by the model, capex inside the objective.
# NoCTN is the Base without its committed Georgia to Armenia line: the gain of that line is the
# difference with the Base. Five-year grid only.
cases:
  Base:
    label: "existing and committed lines; Georgia to Armenia: no line today, committed 350 MW line from 2032"
    Int: {}
    Ext: {}
  BSSC:
    label: "Georgia to Romania subsea cable, 1,300 MW"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_bssc_hvdc_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_robg_bssc_hvdc_v6.csv
    Ext:
      pExtTransferLimit: trade/pExtTransferLimit_ext_bssc_v6.csv
  GECO:
    label: "BSSC plus the three 1,261 MW links from the Georgian hub to Romania"
    Int:
      zcmap: zcmap_robg_geco_v6.csv
      pTransferLimit: trade/pTransferLimit_robg_geco_hvdc_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_robg_geco_hvdc_v6.csv
    Ext:
      zcmap: zcmap_ext_geco_v6.csv
      pExtTransferLimit: trade/pExtTransferLimit_ext_geco_v6.csv
  Onland:
    label: "Georgia to Bulgaria across Türkiye, three legs of 2,000 MW"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_onland_hvdc_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_robg_onland_hvdc_v6.csv
    Ext:
      pExtTransferLimit: trade/pExtTransferLimit_ext_onland_v6.csv
      pTransferLimit: trade/pTransferLimit_ext_onland_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_ext_onland_v6.csv
  EWTC:
    label: "Türkiye to Bulgaria and Türkiye to Greece, 775 MW each"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_ewtc_hvdc_v6.csv
      pExtTransferLimit: trade/pExtTransferLimit_robg_ewtc_v6.csv
  TRIPP:
    label: "mainland Azerbaijan to Nakhchivan 800 MW, Nakhchivan to eastern Türkiye 1,000 MW"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_tripp_hvdc_v6.csv
  TCasp:
    label: "mainland Azerbaijan to Kazakhstan, 1,000 MW"
    Int:
      pExtTransferLimit: trade/pExtTransferLimit_robg_tcasp_v6.csv
  BSTN:
    label: "eastern Türkiye to Georgia reinforcement, 350 MW"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_bstn_hvdc_v6.csv
  ArTur:
    label: "Armenia to eastern Türkiye line, country team table"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_artur_hvdc_v6.csv
  ArAz:
    label: "Armenia to mainland Azerbaijan line, country team table"
    Int:
      pTransferLimit: trade/pTransferLimit_robg_araz_hvdc_v6.csv
  AllProjects:
    label: "every project of the rows above, forced together"
    Int:
      zcmap: zcmap_robg_geco_v6.csv
      pTransferLimit: trade/pTransferLimit_robg_allprojects_hvdc_v6.csv
      pExtTransferLimit: trade/pExtTransferLimit_robg_allprojects_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_robg_geco_onland_hvdc_v6.csv
  FreeExp:
    label: "every line a candidate sized by the model"
    Int:
      zcmap: zcmap_robg_geco_v6.csv
      pTransferLimit: trade/pTransferLimit_robg_freeexp_hvdc_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_robg_geco_onland_hvdc_v6.csv
      pNewTransmission: trade/pNewTransmission_robg_freeexp_v6.csv
      pNewTransmissionExt: trade/pNewTransmissionExt_robg_freeexp.csv
    Ext:
      zcmap: zcmap_ext_geco_v6.csv
      pLossFactorInternal: trade/pLossFactorInternal_ext_onland_v6.csv
      pNewTransmission: trade/pNewTransmission_ext_freeexp_v6.csv
      pNewTransmissionExt: trade/pNewTransmissionExt_ext_freeexp_v6.csv
  NoCTN:
    label: "the Base without the committed Georgia to Armenia line"
    grids: [5y]
    Int:
      pTransferLimit: trade/pTransferLimit_robg_noctn_hvdc_v6.csv

# Sensitivities. A sensitivity runs on the cases listed in `cases` below unless it lists its own,
# and on every grid unless it lists its own (`grids`).
# Int, five-year grid only. The first three came with the corrections of 2026-11-22 (files written
# by edits 2 and 9 of build_robg_v6.py). The next five are the first lot of 2026-11-23 (files
# written by pre-analysis/pipelines/build_sens_v6.py, which states the rule of each one). The last
# seven are part 1 of the second lot, of 2026-11-24: four gas price cases and three demand cases,
# written by the same script. Their levels are interim assumptions until the country teams answer.
# Ext: six EU price cases, files of tools/build_ext_inputs_v6.py. The low and the high case joined
# the grid on 2026-11-23, five-year grid only.
sensitivities:
  cases: [Base, BSSC, GECO, Onland]
  Int:
    ArmeniaGasEU:
      label: "Armenian gas on the price path of the country team table"
      cases: [Base, ArTur, ArAz, TRIPP]
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_armgaseu_v6.csv
    ArmeniaNoNewNuclear:
      label: "the committed Armenian nuclear unit is not built"
      cases: [Base, ArTur, ArAz, TRIPP]
      grids: [5y]
      pGenDataInput: supply/pGenDataInput_v6_{g}_amnonuc.csv
    EUNuclearDelay:
      label: "the committed reactors of Romania, Bulgaria and Hungary start one model step later"
      cases: [Base, BSSC, GECO]
      grids: [5y]
      pGenDataInput: supply/pGenDataInput_v6_{g}_eunucdelay.csv
    ArmeniaGasContract:
      label: "Armenian gas on the border contract path, without the margin of the central"
      cases: [Base, ArTur, ArAz, TRIPP]
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_armgascontract_v6.csv
    ArmeniaDemandLow:
      label: "Armenian demand on the forecast in use before the country team update"
      cases: [Base, ArTur, ArAz, TRIPP]
      grids: [5y]
      pDemandForecast: load/pDemandForecast_v6_amdemlow.csv
    CaucasusREHubs:
      label: "the solar and wind candidates of the two GEC hubs are committed in full, in three steps to 2040"
      cases: [GECO, FreeExp]
      grids: [5y]
      pGenDataInput: supply/pGenDataInput_v6_{g}_gechubs.csv
    EUCarbonLow:
      label: "EU carbon price on the TYNDP 2024 path, above the central to 2031 and below it after (172 against 322 USD/t in 2040); border prices scaled with the cost of gas"
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_eucarbonlow_v6.csv
      pTradePrice: trade/pTradePrice_robg_eucarbonlow_v6.csv
      pTradePriceExport: trade/pTradePriceExport_robg_eucarbonlow_v6.csv
    TurkiyeCarbonPrice:
      label: "a Turkish carbon price at the EU level from 2030, on every fuel with carbon (upper bound)"
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_trcarbon_v6.csv
    WorldGasHigh:
      label: "TTF at 23.2 USD/MMBtu from 2030 (mean of 2021 to 2023): EU gas in full, border prices scaled with the cost of gas, Turkish gas plus 40 percent of the move (15.5 in 2030, 15.0 in 2040); Caucasus on contract"
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_worldgashigh_v6.csv
      pTradePrice: trade/pTradePrice_robg_worldgashigh_v6.csv
      pTradePriceExport: trade/pTradePriceExport_robg_worldgashigh_v6.csv
    WorldGasLow:
      label: "TTF at 5.2 USD/MMBtu from 2030 (mean of 2016 to 2020): EU gas in full, border prices scaled with the cost of gas, Turkish gas at 8.3 in 2030 and 7.8 in 2040; Caucasus on contract"
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_worldgaslow_v6.csv
      pTradePrice: trade/pTradePrice_robg_worldgaslow_v6.csv
      pTradePriceExport: trade/pTradePriceExport_robg_worldgaslow_v6.csv
    TurkiyeGasHigh:
      label: "Turkish gas alone at its level of the world gas high case from 2030 (15.5 in 2030, 15.0 in 2040, against 10.0)"
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_trgashigh_v6.csv
    CaucasusGasNetback:
      label: "Azerbaijani gas at its export netback from 2030 (6.5 against 4.7 to 5.0 USD/MMBtu) and Georgian gas at the netback plus transport (7.0 against 5.7 to 6.1); derived levels"
      grids: [5y]
      pFuelPrice: supply/pFuelPrice_robg_caucasusnetback_v6.csv
    EUDataCentres:
      label: "data centre load on top of the central in Romania and Bulgaria, flat: 4.3, 9.5 and 14.6 TWh in 2030, 2035 and 2040"
      grids: [5y]
      pDemandForecast: load/pDemandForecast_v6_eudatacentres.csv
    TurkiyeDemandLow:
      label: "Turkish demand grows 2.5 percent a year from 2025 (TEIAS high case): 413, 467 and 528 TWh in 2030, 2035 and 2040, against 448, 490 and 645"
      grids: [5y]
      pDemandForecast: load/pDemandForecast_v6_trdemlow.csv
    GeorgiaDemandHigh:
      label: "Georgian demand grows 5 percent a year from 2025 (case L3 of the GSE ten year plan): 20.1, 25.7 and 32.8 TWh in 2030, 2035 and 2040, against 18.8, 21.4 and 24.1"
      grids: [5y]
      pDemandForecast: load/pDemandForecast_v6_gedemhigh.csv
    TurkiyeDry2021:
      label: "Hydro output of 2021 in Türkiye and Georgia, in every model year: Turkish hydro 14 percent below the central (57 TWh on the existing fleet against 66), Georgian hydro 13 percent below (10.2 TWh against 11.7)"
      grids: [5y]
      pAvailability: supply/pAvailabilityCustom_v6_hydro2021.csv
    GeorgiaDry2020:
      label: "Hydro output of 2020 in Georgia and Türkiye, in every model year: Georgian hydro 30 percent below the central (8.2 TWh on the existing fleet against 11.7), Turkish hydro 22 percent above (81 TWh against 66)"
      grids: [5y]
      pAvailability: supply/pAvailabilityCustom_v6_hydro2020.csv
    CaucasusRESigned:
      label: "Caucasus solar and wind held to the signed projects: Azerbaijan 1.68 GW after 2025, generic and hub candidates closed; Georgia held to the GSE pipeline of 2035, 1.3 GW of wind and 0.24 GW of solar"
      grids: [5y]
      pGenDataInput: supply/pGenDataInput_v6_{g}_cauresigned.csv
    EUREPlan:
      label: "National plans of Romania, Bulgaria and Hungary as a floor on solar and onshore wind: 13.1 GW of solar steps in Romania and 5.4 GW in Bulgaria by 2040, 1.7 GW of Romanian wind and 3.8 GW of Hungarian solar in 2030"
      grids: [5y]
      pGenDataInput: supply/pGenDataInput_v6_{g}_eureplan.csv
      pAvailability: supply/pAvailabilityCustom_v6_eureplan.csv
    DobrogeaConstraint:
      label: "Romania in two zones, Dobrogea (section S6 of the transmission grid) and the rest; the Black Sea cables land in Dobrogea, whose exit is held at 3.2 GW in every year, the planned reinforcements not built"
      cases: [GECO]
      grids: [5y]
      zcmap: zcmap_robg_geco_v6_2z.csv
      pDemandForecast: load/pDemandForecast_v6_2z.csv
      pDemandProfile: load/pDemandProfile_v6_2z.csv
      pGenDataInput: supply/pGenDataInput_v6_{g}_2z.csv
      pGenDataInputDefault: supply/pGenDataInputDefault_v6_2z.csv
      pAvailabilityDefault: supply/pAvailabilityDefault_v6_2z.csv
      pCapexTrajectoriesDefault: supply/pCapexTrajectoriesDefault_v6_2z.csv
      pVREProfile: supply/pVREProfile_v6_2z.csv
      pLossFactorInternal: trade/pLossFactorInternal_robg_geco_hvdc_v6_2z.csv
      pTransferLimit: trade/pTransferLimit_robg_geco_hvdc_v6_2z32.csv
  Ext:
    EUVeryLow:
      label: "EU very low price"
      pTradePrice: trade/pTradePrice_ext_eu_very_low_v6.csv
      pTradePriceExport: trade/pTradePriceExport_ext_eu_very_low_v6.csv
    EUCrisis:
      label: "EU crisis price"
      pTradePrice: trade/pTradePrice_ext_eu_crisis_v6.csv
      pTradePriceExport: trade/pTradePriceExport_ext_eu_crisis_v6.csv
    EUCBAM:
      label: "EU central price, CBAM on exports"
      pTradePriceExport: trade/pTradePriceExport_ext_eu_central_cbam_v6.csv
    EUVeryLowCBAM:
      label: "EU very low price, CBAM on exports"
      pTradePrice: trade/pTradePrice_ext_eu_very_low_v6.csv
      pTradePriceExport: trade/pTradePriceExport_ext_eu_very_low_cbam_v6.csv
    EULow:
      label: "EU low price"
      grids: [5y]
      pTradePrice: trade/pTradePrice_ext_eu_low_v6.csv
      pTradePriceExport: trade/pTradePriceExport_ext_eu_low_v6.csv
    EUHigh:
      label: "EU high price"
      grids: [5y]
      pTradePrice: trade/pTradePrice_ext_eu_high_v6.csv
      pTradePriceExport: trade/pTradePriceExport_ext_eu_high_v6.csv

identical_to_archive: {}
