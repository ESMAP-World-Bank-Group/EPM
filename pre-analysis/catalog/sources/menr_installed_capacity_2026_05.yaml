access_note: >
  Official bar chart "Installed Capacity as of 05.2026 (MW)" by primary source and owner
  (EÜAŞ, private sector, unlicensed), shared as a screenshot by the task team on 2026-09-14.
  Total 125,471 MW; natural gas 24,750 (below 20 pct of the total); domestic coal 11,550;
  imported coal 10,462; liquids 260; hydro dam 23,868; solar 26,830 (of which 24,102
  unlicensed); wind 15,105; hydro run of river 8,439; biomass 2,408; geothermal 1,798.
  Monthly installed capacity reports are published by TEİAŞ at the URL above.
