used_in:
  - script: "blacksea_2026/EPM/pre-analysis/pipelines/build_tyndp26_hourly.py"
  - script: "blacksea_2026/EPM/pre-analysis/pipelines/build_tyndp_tidy.py"
  - script: "blacksea_2026/EPM/pre-analysis/pipelines/build_robg_v6.py"
quality:
  confidence: medium
  notes: >
    Model output of a published European scenario, not an observed price: a marginal cost of
    a dispatch model with its own fuel, CO2 and capacity assumptions. Read exactly (KPI
    control at 0.005 EUR/MWh, and no difference on 168 series against an earlier independent
    extraction). Points to keep in view. The 300 EUR/MWh cap is a modelling choice of this
    study (interim flag F10): without it Austria 2040 would stand at 107.71 EUR/MWh. Ukraine
    falls to 29.65 in 2035 and 22.33 in 2040, which is what the TYNDP run holds for UA00. The
    quarter rescale keeps quarterly and annual means exact but the hourly spread inside a
    quarter is the one of seven representative days (factors 0.78 to 1.38, mostly 0.95 to
    1.15). The level is well below the v5 trajectory built on TYNDP 2024: Hungary 95.8 USD/MWh
    in 2030 in v5 against 72.6 on HU00 here. The 2024 and 2025 rows of Austria, Slovakia,
    Croatia and Slovenia are a ratio to Hungary, not an own back-cast: ASSUMPTION.
    Fuel and CO2: scenario assumptions of the TYNDP, read from fixed rows with a sha256
    control. The CO2 price is far above the v5 path after 2032 (322 USD/t in 2040 against
    172, 544 in 2050 against 196), which carries gas with CO2 from 16.9 to 29.7 USD/MMBtu in
    2040. The 0.90 net to gross factor on gas is a convention, not a TYNDP figure. The
    Hungarian biomass price (15.0 USD/MMBtu, the Romanian row) is an ASSUMPTION.
    Reference grid NTC: planning values of a draft edition, read exactly (checked against the
    workbook and the package sha256). Three points to keep in view. Bulgaria-Serbia falls
    from 750 MW in v5 (an observed 2025 flow statistic) to 380 MW from 2030 to 2034, the 2025
    NTC of the grid, before the project of 2035. Ukraine to Romania is 50 MW from 2030
    against 234 MW in v5, and Moldova to Romania 50 MW: the low Ukrainian prices of the same
    edition reach Romania through 50 MW only. Romania-Moldova and Romania-Ukraine carry the
    same 2025 NTC in the grid (315 and 82), which may be one limit shared by the two borders;
    the model applies it to each border.
  used_in_studies: [data_blacksea]
