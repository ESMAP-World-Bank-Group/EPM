quality:
  confidence: medium
  notes: >
    Official plan, but the coal date is a latest date ("by 2038 at the latest") and the model
    takes it as the retirement year: the blocks are in service in every model year before
    2038 and out from 2038 on, and their dispatch stays economic. The nuclear years are five
    year steps of the scenario. The lifetime of units 5 and 6 is a safety assessment, not a
    licence in force to those years.
  used_in_studies: [data_blacksea]
