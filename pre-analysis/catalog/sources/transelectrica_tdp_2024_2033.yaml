id: transelectrica_tdp_2024_2033
name: "Transelectrica, Electricity Transmission Grid Development Plan 2024-2033 (PDRET): net transfer capacity per border"
type: open_source
category: study_document
url: "https://www.transelectrica.ro/"
date: "2024"
access_note: >
  Basis of three Romanian border limits (edit 3) of the v6 input family, built 2026-11-21.
  Read by the v6 scenario columns only. The v5 limit files are untouched and keep their
  source (entsoe_borders_robg_2025).

  Local copy: Data/NDPs/Romania - Transelectrica grid development plan 2024-2033 (RO).pdf,
  134 pages, Romanian, sha256 ef817e75a0119558cba6675201704cfdd46cddaff9f35f8d9ad30a7c6b38bd55.
  The table is an image in the PDF: it was read on the rendered page and typed into
  pre-analysis/pipelines/build_robg_v6.py (TDP_NTC), with the total rows as a control.

  TABLE 5.4.2, page 56, "Valorile NTC pentru orizonturile analizate" (NTC values for the
  horizons analysed), MW:

    row         2024   2025   2028   2030   2033
    RO export   3115   4200   6050   6050   7350
    RO - HU      800   1340   1700   1700   2300
    RO - BG     1560   1560   2550   2550   2550
    RO - RS      500    800   1300   1300   2000
    RO - UA      255    500    500    500    500
    RO import   3142   4200   6050   6050   7350
    HU - RO     1000   1340   1700   1700   2300
    BG - RO     1560   1560   2550   2550   2550
    RS - RO      500    800   1300   1300   2000
    UA - RO       82    500    500    500    500

  The table has no Moldova row.

  FROM THE TABLE TO THE MODEL FILES (pre-analysis/pipelines/build_robg_v6.py, edit 3).
  1. Borders taken from this table: Romania with Hungary, Serbia and Bulgaria, both
  directions. Horizons used: 2030 and 2033.
  2. Years: the v5 cells are kept until 2029. The 2030 value holds for 2030 to 2032, the 2033
  value from 2033 to 2053. The four quarters carry the same value.
  3. Result, MW each way: Romania-Hungary 1,700 then 2,300 (v5 1,000 flat), Romania-Serbia
  1,300 then 2,000 (v5 800 flat), Romania-Bulgaria 2,550 from 2030 (v5 1,400 flat).
  4. Not taken from this table: Romania-Ukraine (500 MW each way in the table) and
  Romania-Moldova (no row), which follow the TYNDP 2026 reference grid (tyndp_2026_ntplus).
  The 2025 and 2028 columns are not used either: the v5 values, built on the observed 2025
  flows, stay in place until 2029.
  5. Since edit 4 of the v6 family (2026-11-21) Hungary is a modelled zone. The
  Romania-Hungary values of this table (1,000 MW until 2029, 1,700 MW from 2030 to 2032,
  2,300 MW from 2033, each way) are no longer rows of the external limit file: they are the
  rows Romania-Hungary and Hungary-Romania of trade/pTransferLimit_robg_hvdc_v6.csv.
coverage:
