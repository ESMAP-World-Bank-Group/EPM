  - resource: pTransferLimit
    coverage: "trade/pTransferLimit_robg_hvdc_v6.csv, rows Romania-Bulgaria and Bulgaria-Romania, Romania-Hungary and Hungary-Romania, years 2030 to 2053"
derived_files:
