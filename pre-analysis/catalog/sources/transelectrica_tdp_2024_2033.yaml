used_in:
  - script: "blacksea_2026/EPM/pre-analysis/pipelines/build_robg_v6.py"
quality:
  confidence: medium
  notes: >
    The TSO's own planning values, read exactly (the four borders add up to the total rows
    of the table in 2030 and 2033). They are planning NTC that assume the reinforcements of
    the plan are delivered on time, not observed capability: the 2025 column gives 1,340 MW
    on Romania-Hungary where the 2025 flows gave 1,000. Romania-Hungary is allocated flow
    based in the Core region, so an NTC is a simplification on that border. The TYNDP 2026
    reference grid is higher on Hungary and Serbia (Romania to Hungary 2,650 in 2030 and
    3,700 from 2035; Romania to Serbia 2,650) and lower on Bulgaria (2,100 and 2,200). An
    edition of 2024: the 2026-2035 plan may move these values.
  used_in_studies: [data_blacksea]
