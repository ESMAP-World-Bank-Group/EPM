id: blacksea_load_vre_2023
name: "Black Sea hourly load + VRE, representative-days pipeline (ENTSO-E · EPİAŞ · Renewables Ninja)"
type: open_source
category: derived
date: "2026"
# Composite/derived source, NOT a single portal. Underlying hourly LOAD = ENTSO-E for
# Georgia/Armenia/Romania/Bulgaria, EPİAŞ for Türkiye; VRE = Renewables Ninja; reduced to
# 28 representative days by the internal pipeline. URL points to ENTSO-E (the real-load
# portal for the documented Caucasus/EU zones) — do NOT read it as "the data is EPİAŞ".
url: "https://transparency.entsoe.eu/"
access_note: >
  End-to-end temporal inputs for the Black Sea model, assembled by
  pre-analysis/studies/blacksea_2026/run_blacksea_data.py (Load + VRE) and reduced by
  pre-analysis/representative_days/run_blacksea_repdays.py.
  All series in UTC (common reference for hourly cross-zone trade), representative
  YEAR = 2023 (only year with complete Load for all zones AND Ninja VRE).

  HOURLY LOAD (per zone):
   - Turkiye 9 zones : REAL EPIAS national hourly (seffaflik.epias.com.tr, via eptr2),
     disaggregated by pDemandForecast zone energy weights (one national shape per zone).
   - Georgia, Romania, Bulgaria : ENTSO-E Transparency actual load (Georgia complete only
     from 2022; hence 2023 chosen). https://transparency.entsoe.eu/
   - Armenia : proxy = Georgia (ENTSO-E) shape scaled to ~7 TWh (no Armenia hourly exists).
   - AzerbaijanMain : proxy = Turkey (EPIAS) shape scaled to ~29.3 TWh (no Azerbaijan hourly).
   - Nakhchivan : shares AzerbaijanMain shape; own absolute from pDemandForecast/pGenDataInput.
   - 397 NaN hours (ENTSO-E gaps) interpolated per zone.

  VRE (solar & wind, per zone): Renewables Ninja for each zone centroid (2018-2023, UTC).
  ROR NOT clustered here -> auto-filled by the model (EPM_FILL_ROR_FROM_AVAILABILITY=1).
  OffshoreWind profile: Renewables Ninja has no offshore series for these zones, so the
  onshore SHAPE is reused. Until 2026-08-29 it was reused UNCHANGED, i.e. the offshore
  profile was byte-identical to the onshore one in all 15 zones — offshore therefore ran at
  the onshore capacity factor (0.21-0.26) against offshore capex (3.0 M$/MW, FOM 70000) and
  could never be built anywhere in the model, including the 35 GW of Turkish offshore
  candidates. The shape is now uplifted by a single scalar per zone, saturating at 1.0, until
  the pHours-weighted capacity factor reaches a target for the sea basin: 0.42 Caspian
  (AzerbaijanMain, uplift x2.39), 0.45 Turkish Black Sea (NorthWest, x2.42) and 0.45 Aegean
  (WestAna, x2.06). Trakia was left untouched: its onshore CF is already 0.494, above the
  target — which is itself implausibly high for onshore wind and is an open item on the
  Turkish wind profiles, not on offshore. Saturation clips 15-29% of the hours at 1.0, so the
  uplifted series understates offshore variability at the top of the distribution. This is a
  yield correction on a borrowed shape, NOT an offshore wind resource assessment; replace with
  a real offshore reanalysis (ERA5 at hub height over the licence areas) before reporting any
  result that depends on offshore build.

  REPRESENTATIVE DAYS (Poncelet et al. 2017): 4 calendar seasons x 7 days = 28 slices.
  Per season: 4 clustered "representative" days + 3 extreme days (min_PV, min_Wind, max_Load),
  each weighted; weights sum to 365. feature_selection=20 series to keep the GAMS optim tractable.
  Validated: load duration curves reproduced (peak error 0-2.4%).

coverage:
  countries: [Turkiye, Georgia, Armenia, Azerbaijan, Romania, Bulgaria]
  years: "hourly 2018-2023; representative year 2023"

fills_epm_resources:
  - resource: pHours
    coverage: "28 (season, daytype) weights summing to 365 days"
  - resource: pDemandProfile
    coverage: "Normalized hourly demand shape per zone x (season, daytype)"
  - resource: pVREProfile
    coverage: "Normalized hourly CF per zone x tech (PV, OnshoreWind, OffshoreWind) x (season, daytype)"

quality:
  confidence: medium
  notes: >
    Turkiye load is real (EPIAS); Georgia/RO/BG real (ENTSO-E). Armenia (=Georgia) and
    Azerbaijan (=Turkiye) loads are proxies -> flag for AzerEnerji/EPSO SCADA. Single year
    (2023) -> no inter-annual hydro/wind variability; 2023 was a milder peak year for
    Georgia/Armenia (their 2023 peak ~75% of all-years max). OPEN quality gates: (1) 8760h
    dispatch-only validation of the rep-days optimisation error; (2) confirm 2023 hydro-year
    representativeness. OffshoreWind = onshore proxy. ROR auto-filled from availability.
  used_in_studies: [data_blacksea]
