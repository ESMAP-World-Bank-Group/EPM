quality:
  confidence: medium
  notes: >
    WHAT THE SCENARIO NAMES MEAN. The IEA World Energy Outlook publishes three
    scenarios: STEPS (Stated Policies — only policies actually in force or announced),
    APS (Announced Pledges — all announced climate commitments are met) and NZE (Net
    Zero Emissions by 2050). The more the world decarbonises, the less gas it burns and
    the cheaper gas becomes, so STEPS carries the HIGHEST gas price of the three.
    A model using STEPS is therefore already on the most expensive gas trajectory this
    source offers; a "gas stays expensive" case must be constructed by hand.
    PRICE LEVEL: this is an import-parity cost, not the regulated BOTAŞ resale tariff to
    power plants. Türkiye imports ~99% of its gas and BOTAŞ has historically resold to
    generators below its own cost; pricing the resource rather than the tariff is the
    correct economic-cost convention for a least-cost study, and matches the treatment
    of Azerbaijan in this deployment.
    INDEPENDENT CHECK: the 2024–25 value of 11.3 $/MMBtu corresponds to the BOTAŞ
    power-sector tariff of ~12,000 TL/1000m3, so the near-term calibration is sound.
    The 2025–2030 fall from 11.3 to 6.5 is the model's single largest driver of regional
    flows and is a scenario, not a forecast.
  used_in_studies: [data_blacksea]
