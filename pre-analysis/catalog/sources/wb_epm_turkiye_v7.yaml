  - resource: pFuelPrice
    location: "Sheet 'Fuel Prices', rows where scenario = STEPS and zone = Turkiye"
    coverage: >
      Gas, ImportedCoal, DomesticCoal, HFO (FuelOil), Uranium (Nuclear), Biomass.
      Gas: 11.3 (2024–25) → 6.5 (2030) → 7.6 (2040) → 7.7 (2050+).
