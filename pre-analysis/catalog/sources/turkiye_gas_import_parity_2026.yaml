id: turkiye_gas_import_parity_2026
name: "Türkiye gas import-parity cost, 2026 review (World Bank CMO April 2026 + BOTAŞ contract indexation)"
type: open_source
category: derived
date: "2026-08"
url: "https://thedocs.worldbank.org/en/doc/f3138644a1e8e2bb631399ae11d6c408-0050012026/related/CMO-April-2026-Forecasts.pdf"
access_note: >
  A constructed trajectory, not a published series. Türkiye imports ~99% of its gas, so its
  delivered cost is an import-parity blend of the two indices its supply contracts are written
  against. Two published inputs, one conventional parameter.

  (1) INDEXATION SPLIT. Türkiye's active gas import contracts were indexed to 40% TTF and
      60% oil as of 2024 (Enerji IQ, cited in Ibrahim Said Arınç, "Unlocking the Potential of
      the Turkish Natural Gas Market", Center for International Policy Research,
      https://cipresearch.org/publication-detail-8.html). The hub-indexed share has been
      rising: ICIS reported Turkish importers raising hub indexation from 2021 onward.
      BOTAŞ's long- and short-term contracts with Russia and Iran — 55% of import volume —
      expire by end-2026, so renewals will be struck against post-crisis market conditions,
      not against the pre-2022 slopes.

  (2) TTF LEG. World Bank Commodity Markets Outlook, April 2026, Table 1, "Natural gas,
      Europe", nominal USD/mmbtu: 11.0 (2024), 12.0 (2025), 15.0 (2026f), 12.0 (2027f).
      The 2026 spike is the Strait of Hormuz closure and damage to Qatari LNG capacity;
      the CMO expects a ~20% fall in 2027 as disruptions subside, back to 12.0. The CMO
      publishes no forecast beyond 2027, so 12.0 is taken as the post-disruption level.
      The same chapter notes that refilling European inventories will require "higher
      pipeline shipments from North Africa and Russia (for example, through Türkiye)" —
      directly relevant to the transit value this study is trying to price.

  (3) OIL LEG. CMO April 2026 Brent forecast: 80.7 (2024), 69.0 (2025), 86.0 (2026f),
      70.0 (2027f). At a conventional 12% Brent slope for oil-indexed long-term gas
      contracts (industry range 10-14%), 70 USD/bbl gives 8.4 USD/mmbtu.

  BLEND: 0.40 x 12.0 + 0.60 x 8.4 = 9.84 USD/mmbtu, rounded to 10.0. LNG regasification
  and inland transport are not added, so 10.0 is if anything a floor on delivered cost to
  a Turkish CCGT.
coverage:
  countries: [Turkiye]
  years: "2024-2027 published; 2028-2053 constructed plateau"
fills_epm_resources:
  - resource: pFuelPrice
    location: "Turkiye/Gas row of supply/pFuelPrice_tr_gas_flat.csv"
    coverage: >
      Gas 11.3 USD/mmbtu (2024-2025, unchanged from the TEİAŞ/BOTAŞ-calibrated base year),
