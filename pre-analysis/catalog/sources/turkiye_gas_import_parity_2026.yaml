quality:
  confidence: medium
  notes: >
    A SCENARIO, NOT A FORECAST, and it should be labelled as such in any deck. What it
    encodes is that the post-2022 repricing of European gas is durable rather than
    transitory. The alternative it replaced — IEA WEO STEPS via the WB EPM Türkiye v7
    workbook, 6.5 USD/mmbtu by 2030 — encodes the opposite. Neither is observable.

    WHY THE STEPS TRAJECTORY WAS DEMOTED TO A SENSITIVITY. Its 6.5 in 2030 traces back to a
    pre-2022 market view; the World Bank's own April 2021 long-term forecast carried
    6.5 USD/mmbtu for 2035, and the WEO STEPS number is of that vintage. Against the CMO
    April 2026 realised print of 12.0 for 2025 it is off by nearly a factor of two in the
    base year of the projection period, and it requires Türkiye's delivered cost to fall
    below the European hub price while the hub-indexed share of its contracts is rising.

    WHY 10 AND NOT 8.5. An earlier version of this file used 8.5, read off European forward
    quotes. The forwards are thinly traded beyond three years and were struck before the
    Hormuz disruption; the contract-indexation derivation above is reproducible from two
    published World Bank numbers and is the reason the plateau was raised to 10.0 on
    2026-08-25.

    WHAT IT ACTUALLY DID (run simulations_run_20260825_053953, first run on this
    trajectory). Not what was predicted here before the run, and the difference matters.
    The forecast was that the Turkish zonal price would rise to ~60 USD/MWh (10.0 x the
    5.88 mmbtu/MWh heat rate of the marginal generic CCGT) and saturate the 700 MW
    Georgia-EastAna corridor. Neither happened. At 10.0 USD/mmbtu gas leaves the merit
    order of eastern Turkiye altogether: EastAna generates 0.6 GWh from gas in 2040 against
    15,433 GWh of PV and 14,662 GWh of hydro, holds 33 MW of gas capacity, and emits
    0.00 MtCO2. The generic CCGT is never built. The zonal price settles at 46.6 USD/MWh,
    set by the solar-plus-storage system rather than by fuel, and the corridor falls to
    2,947 GWh in 2035 out of 6,132 available, so the model is still arbitraging on price.
    The price-equals-gas-times-heat-rate rule holds only while gas is marginal, and at this
    level it no longer is in the east; western Turkiye still burns (WestAna 42.2 MtCO2,
    NorthWest 30.8) and still prices at 47-53. THE EFFECT OF THIS ASSUMPTION IS A CHANGE OF
    MIX, NOT A CHANGE OF PRICE. It also removed the 2030-2033 reversal of the
    Georgia-Turkiye corridor seen under the STEPS trajectory, which was an artefact of gas
    falling to 6.5 in 2030.

    THIS IS AN IMPORT-PARITY COST, NOT THE BOTAŞ TARIFF. BOTAŞ resells to power plants at a
    regulated tariff historically below its own cost. Pricing the resource rather than the
    tariff is the correct economic-cost convention and matches the treatment of Azerbaijan.
  used_in_studies: [data_blacksea]
