  pCapexTrajectoriesDefault:
    path: supply/pCapexTrajectoriesDefault.csv
    group: Fleet
    action: table
    from: extracted/pCapexTrajectoriesDefault.csv    # produced by build_fleet.py
    work: FILL
    priority: P2
    source: ["deca_v51"]
    confidence: high
    sheet: >
      CAPEX
    vintage: "2023-2050, normalised at 2026"
    what: >
      CAPEX by (zone,tech,fuel)
    note: >
      PHASE 5 done. The table was empty, so every candidate cost the same in 2050 as in
      2026. It now carries the DeCA cost curve as a multiplier normalised at 2026, for
      solar, wind and the battery, in every zone: solar to 0.46 by 2050, wind to 0.88,
      the four-hour battery to 0.64.
      Applied in every zone, Pakistan and Afghanistan included, because the five DeCA
      books carry the same CAPEX sheet byte for byte. That makes it a technology curve
      and not a country one, and there is no reason a Pakistani panel would be spared a
      fall in the world price of panels. The battery rows stop at the DeCA perimeter,
      only because that is where the battery candidates are.
      PHASE 8 HAD TO COMPLETE THE TABLE, and the reason is worth recording because it
      contradicts what phase 5 wrote here. Leaving thermal out is not neutral:
      input_treatment.py joins this table on the (zone, tech, fuel) of EVERY generator
      of the fleet and stops the run when one of them finds no row, "Missing values in
      default is not permitted". Forty rows against a hundred and thirty-eight triples
      was an aborted run, not a flat cost. So the builder now writes a FLAT CURVE, one
      everywhere, for every triple the fleet carries and the cost curve says nothing
      about: a gas turbine of 2050 is assumed to cost in real terms what it costs
      today, which is what DeCA says of it and what the model would otherwise have
      assumed by default. The DeCA curve still applies to solar, wind and the battery
      alone, and the print of build_fleet.py says how many rows are on a curve.

  pFuelPrice:
    path: supply/pFuelPrice.csv
    group: Fleet
    action: table
    from: extracted/pFuelPrice.csv    # produced by build_costs.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: medium
    sheet: >
      Fuel Prices for gas and nuclear, Thermal PP column Local Fuel Costs Adopted for coal
    vintage: "2024-2060 real 2021 USD, read on 2026-2050"
    what: >
      fuel prices by country (c,fuel,year)
    note: >
      PHASE 6 done. THE TABLE WAS THE MOST DAMAGING DEFECT LEFT IN THE MODEL: it ran
      2017 to 2030 against a horizon that runs 2026 to 2050, and main.gms:737 reads
      pFuelCost = pFuelPrice * pHeatRate with no interpolation and no default, so every
      fuel in every zone was FREE from 2031 on. Half the horizon was arbitrating thermal
      against renewable at zero fuel cost.
      Rebuilt by build_costs.py from mappings/fuel_prices.csv, which carries the 25
      country and fuel pairs one by one. 8 rest on DeCA and 17 keep the 2020 series held
      flat: DeCA prices neither heavy fuel oil nor LNG, Pakistan and Afghanistan are
      outside its perimeter, and its coal is unusable in two of the five countries, see
      below.
      GAS AND NUCLEAR COME FROM THE Fuel Prices SHEET. Gas is already in $/MMBtu and is
      taken as it stands; the stated method is the actual 2024 price of each country
      converging linearly to the netback value of the Chinese gas price by 2030, which
      is a documented economic price and the right thing for a planning model. Nuclear
      is stated at 2.92 $/MWh of electricity and divided by the heat rate the model
      itself carries for its uranium units, 8.322 MMBtu/MWh, giving 0.3509 $/MMBtu
      against 0.3842 in the 2020 model, a 9 per cent gap that is a good check on the
      method. Where the transport adder of DeCA is a national constant it is added
      here: Uzbek gas 1.866 over 22 units, Turkmen gas 0.140 over 17.
      COAL DOES NOT COME FROM THAT SHEET, and this is the judgement of the phase. The
      sheet is headed International Prices, its coal row is the same 33.53 $/mt in all
      five countries and in every year from 2024 to 2060, and the convergence method
      printed underneath is written for gas alone. It is the seaborne benchmark. Nobody
      burns Angren lignite or Ekibastuz coal at the seaborne price, and taking it would
      have tripled Kazakh coal and quadrupled Uzbek coal on no evidence at all. Coal is
      read instead from the Local Fuel Costs Adopted column of Thermal PP, the price
      DeCA fed its own plants. THAT COLUMN IS FILLED FOR TWO BOOKS ONLY, and not in the
      same unit in both: in UZ it is $/MWh of electricity, the product of the value and
      the plant efficiency being constant at 9.0 to 9.4 across the 22 gas units, while
      in KG it is $/MMBtu per plant. Reconverted and capacity weighted it gives 3.438
      $/MMBtu for Angren, against 1.202 in the 2020 model, and 2.684 for Kyrgyzstan,
      against 4.280. Both are delivered prices per plant, so no transport is added on
      top and NO CALORIFIC VALUE IS ASSUMED ANYWHERE, which removes what was the weakest
      link of an earlier draft of this table.
      KAZAKH AND TAJIK COAL THEREFORE HAVE NO DeCA PRICE AT ALL: those books leave the
      local column empty. They keep the 2020 model held flat, which also preserves the
      1.467 delivered ratio between northern and southern Kazakhstan.
      KAZAKH GAS TRANSPORT IS NOT HERE EITHER. It is the one genuinely regional fuel
      cost in the region, 0 on the Atyrau gas fields to 13.3 at the end of the pipeline
      in Akmola, a spread wider than the commodity itself. A national mean would be
      meaningless when the model carries two Kazakh gas plants sitting at opposite ends
      of that range, so each takes its own through its VOM. See pGenDataInput.
      WHAT IT DOES TO THE MERIT ORDER, short-run marginal cost in 2026, before and
      after: Ekibastuz 19.7 to 19.5 $/MWh, Aksu 19.7 to 18.4, Astana-2 22.5 to 26.9,
      Angren 24.0 to 47.9, Novo-Angren 24.3 to 46.3, Bishkek 60.9 to 43.0, Syrdarya
      68.0 to 73.1, Mary 57.3 to 40.0, Zhambyl 67.2 to 50.0. Uzbek coal doubling is the
      one number to challenge, and it is DeCA saying the 2020 model priced it too low.
    todo: >
      1. KAZAKH AND TAJIK COAL ARE THE FIRST DATA REQUEST of this phase: neither book
      states a local price, so both still rest on a 2020 figure held flat to 2050. The
      Kazakh one matters most, it prices roughly 10 GW of the fleet.
      2. Coal carries no trajectory anywhere: the two DeCA local prices are single 2020
      figures and the other two are held flat. Nothing in this table makes coal dearer
      or cheaper over twenty-five years.
      3. Heavy fuel oil, LNG, and everything Pakistani and Afghan rest on the 2020 model
      held flat. Pakistan needs the NTDC IGCEP fuel assumptions.

  pStorageDataInput:
    path: supply/pStorageDataInput.csv
    group: Fleet
    action: table
    from: extracted/pStorageDataInput.csv    # produced by build_fleet.py
    work: FILL
    priority: P2
    source: ["deca_v51", "assumed"]
    confidence: medium
    sheet: >
      CAPEX, columns 2h / 4h / 6h / 8h BESS
    vintage: "2023-2060, read at 2026"
    what: >
      storage (batteries, pumped hydro)
    note: >
      PHASE 5 done. The table was empty, in a model that runs to 2050. It now carries
      one four-hour battery candidate per Central Asian zone, eight of them, open from
      2028.
      The cost is read, not assumed. DeCA prices a battery at 2, 4, 6 and 8 hours and
      those four prices are exactly linear in duration in every year from 2023 to 2060,
      so the slope is the cost of an hour of energy and the intercept is the cost of the
      power: 247,638 $/MW and 202.3 $/kWh in 2026, falling to 198,754 $/MW and
      118.2 $/kWh in 2050. build_fleet.py re-checks that linearity and refuses to write
      anything if a later version of the book breaks it.
      Four hours is a choice, and it is the one that makes EPM exact: EPM applies a
      single CAPEX multiplier to both the power and the energy part of a battery, and
      those two decline at different rates in DeCA. At a fixed duration the multiplier
      is exact on the total, which is what is being bought.
      The perimeter is the five DeCA countries, mappings/country_book.csv. Pakistan and
      Afghanistan keep no storage, as in the 2020 model.
      DeCA gives no round-trip efficiency and no operating life for storage: 0.9 and
      20 years are the EPM reference values, data_test.
    todo: >
      Storage only earns its keep once the model has intra-day chronology. The candidate
      is in place so that phase 8 has something to switch on, but nothing will be built
      until pHours carries real hours. Pumped storage is a separate question: DeCA
      carries Hodjikent PSH-2 in Uzbekistan, which sits in pGenDataInput as a hydro
      candidate rather than here.

