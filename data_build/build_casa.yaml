  # ---- Fleet -------------------------------------------------------------
  pGenDataInput:
    path: supply/pGenDataInput.csv
    group: Fleet
    action: table
    from: extracted/pGenDataInput.csv    # produced by build_fleet.py
    work: FILL
    priority: P1
    source: ["deca_v51", "casa_2020", "assumed"]
    confidence: medium
    sheet: >
      RenewableMaxEntry and CAPEX of the five books, tech_lifetime.csv and
      fleet_retirement.csv, over the 2020 table
    vintage: "2022 base, retirement rebuilt 2026"
    what: >
      power plants: capacity, status, HR, costs, 403 units
    note: >
      PHASE 5 done, on the structure. Two rebuilds, both driven by mappings/ and both
      re-runnable with data_build/build_fleet.py.
      THE RETIREMENT SCHEDULE. The 2020 schedule was mechanical,
      min(max(StYr + Life, 2023), 2031), and that reproduces 208 of its 232 existing
      units exactly. Neither bound was a decision: 2031 was where that model stopped
      looking, 2023 was the day it was built. Carried into a run that goes to 2050 they
      wiped out 66 GW in one year, Nurek, Toktogul and Ekibastuz included, and left
      375 MW standing in the whole model in 2050. Rebuilt from an operating life stated
      per technology in mappings/tech_lifetime.csv, with a floor at the start year plus
      four so that a plant running today does not vanish at the first year, and anything
      reaching 2050 still standing written as 2051, which in EPM means it never retires
      inside the run. Central Asia now goes 51.3 GW in 2026 to 23.5 GW in 2050, hydro
      holding at 16.4 GW throughout. 12 units keep a dated year, held in
      mappings/fleet_retirement.csv: the eight Nurek units taken off one at a time for
      rehabilitation, whose refurbished replacements are already in the table, and
      Bishkek CHP, which the 2020 model had itself singled out.
      DeCA GIVES NO RETIREMENT DATES. It carries a commissioning year and nothing on the
      end of life, so the lives in tech_lifetime.csv are an assumption, not a
      measurement, and they are the assumption most worth challenging with the TSOs.
      PHASE 8 FOUND THAT LIFE IS NOT A DURATION TO THIS MODEL, IT IS A FLAG, and the
      first run stopped on it. main.gms:879 reads a life of 99 as "this unit may never
      be retired" and fixes vRetire to zero for it, while main.gms:864 fixes the
      capacity of any unit to zero from its retirement year on. A unit carrying both a
      life of 99, which tech_lifetime.csv gives to hydro, and a dated stop inside the
      horizon is therefore asked to lose its whole capacity with nothing allowed to
      move: base.gms:770 and base.gms:775 came out infeasible on the eight Nurek units
      and the run aborted before solving. build_fleet.py now writes, for a unit whose
      stop is dated, the life that decision implies rather than the flag, Nurek 3 for
      instance stopping after 53 years. Nothing else changes: no equation of the model
      reads the life of a generator for anything but that flag, and retirement carries
      no cost in the objective.
      THE CANDIDATES, 124 lines touched, driven by mappings/candidate_limits.csv.
      Three things were wrong for a 2050 run. First the closed door: main.gms:754 makes
      the Capacity column the cumulative build limit of a candidate and it was 0 for 30
      of them, every generic candidate of KGZ_N, KGZ_S, TAJ_N and TAJ_S bar a 200 MW
      CCGT, and four of KAZ_S. Kyrgyzstan and Tajikistan could build nothing at all
      outside named hydro projects, which alone explains why the winter unserved energy
      of TAJ_N only cleared with Rogun. Opened. Second the missing speed limit:
      BuildLimitperYear was ten million MW everywhere, so solar and wind could appear at
      any rate. DeCA states a real one per country in RenewableMaxEntry, 3000 MW a year
      of each for KZ and UZ, 500 for KG, TJ and TM, and it steps up after 2030 to 6000,
      1500 and 3000. EPM has one column and cannot step, so each zone carries two
      candidates: the first from the opening of the run with the early rate, a second
      from 2031 with the increment. The national rate is shared across the zones of a
      country by their share of the national peak in 2050. Third, the cumulative cap of
      those VRE candidates is now derived from the rate rather than left at the round
      10000 of the 2020 table, which was another number that meant no cap over a horizon
      stopping in 2031 and would have meant four years of Kazakh solar over one running
      to 2050.
      PHASE 6, THE COST COLUMNS. HeatRate and VOM of the existing Central Asian
      thermal fleet are rebuilt by build_costs.py from mappings/thermal_plants.csv,
      which carries all 70 of those units one by one against the DeCA Thermal PP
      sheets. 63 are matched to a named DeCA plant and 7 are not, each with its reason
      in the mapping: two Kazakh residual aggregates that are not plants, the Balkhash
      Ulken project and Karaganda TPS-2 which DeCA does not carry, Yavan likewise, and
      Almaty-1 and Fergana where the model and DeCA disagree on the fuel itself.
      THE HEAT RATE IS TAKEN FROM DeCA WHEREVER A UNIT IS MATCHED, because a stated
      per-plant efficiency beats a per-technology constant: the 2020 model gave every
      Kazakh coal CHP the same 11.23 where DeCA separates them from 0.208 at Astana-2,
      which becomes 16.40, to 0.275 at Pavlodar-3, which becomes 12.42. 15 of the 63
      units were already carrying the DeCA value, which is a good sign on the match.
      Shymkent moves the other way, 11.23 to 6.09, DeCA giving it a combined cycle
      efficiency of 0.560.
      THE VOM IS TAKEN ONLY WHERE DeCA DEPARTS FROM ITS OWN DEFAULT. It writes 3.400
      $/MWh for 128 of its 136 thermal units, across five countries and every
      technology at once, which is a filler and not a measurement, and adopting it
      would flatten the technology spread the 2020 model does carry. Where it does
      depart, the departure is the information: the old Uzbek steam sets at 9.100,
      Takhiatash at 3.540, Navoi at 3.500, the combined cycles at 4.250.
      KAZAKH GAS TRANSPORT LANDS IN THE VOM rather than in pFuelPrice, because it is
      the one genuinely regional fuel cost in the region and the model carries only two
      Kazakh gas plants, at opposite ends of it. Zhambyl takes 0.370 $/MMBtu over its
      own 9.399 MMBtu/MWh and Shymkent 4.998 over 6.093, so their VOM reads 18.9 and
      39.2 $/MWh. That looks alarming and is not: the decomposition moved, the total
      did not, and both plants come out cheaper than before, 67.2 to 50.0 $/MWh at
      Zhambyl and 64.7 to 59.4 at Shymkent.
      The step is idempotent, every value it writes being absolute and the VOM baseline
      always read from the 2020 reference rather than from the file under the pen. RUN
      ORDER IS build_fleet.py THEN build_costs.py, the second rewriting the file the
      first produces.
      PHASE 6, THE CANDIDATE COSTS. HeatRate, Capex, FOMperMW, VOM and Life of the
      86 thermal candidates are rebuilt from the Thermal PP Candidates sheet through
      mappings/thermal_candidates.csv, which says which DeCA line each of the eleven
      (tech, fuel) pairs of the model reads. 79 rows move and 7 keep their 2020 costs,
      the coal fired CHPs and the oil fired steam turbines, DeCA carrying neither.
      THAT SHEET IS A TECHNOLOGY TABLE AND NOT A COUNTRY ONE: the five books state the
      same numbers to the dollar, so it is read from all five at once and any book that
      departs is outvoted and the departure printed. One does, TJ pricing new coal at
      500,000 $/MW where the other four say 2,500,000, which is a typo and not a Tajik
      discount. Being a technology table is also what licenses using it in Pakistan and
      Afghanistan, outside the DeCA perimeter: the 2020 model applied ONE GLOBAL COST
      SET to all sixteen zones, so holding those two on 2020 while the five move would
      not preserve a country difference, it would invent one and let the model
      arbitrage on it.
      NEW COAL IS READ ON THE Supercritical LINE AND NOT ON THE ONE HEADED Coal, which
      is the judgement of the step. The Coal line states an efficiency of 0.33 at
      2,500,000 $/MW while Supercritical, four rows below it in the same table, states
      0.46137 at 2,250,000: cheaper to build, cheaper to run and half again as
      efficient, so the plain line is dominated by its own neighbour and no planner
      would ever pick it. The 2020 model already carried 0.42 here, a supercritical
      class unit. One word in the mapping falls back to the subcritical line.
      LIFE MOVES WITH THE COSTS BECAUSE IT MUST: main.gms:742 builds the capital
      recovery factor out of it, so taking a CAPEX without the amortization period
      stated beside it would annualize the new number on the old horizon. CCGT and gas
      turbines go from 30 years to 25, coal from 40 to 35, engines from 20 to 25, and
      nuclear from 40 to 60.
      WHAT IT COSTS, levelised at a 75 per cent capacity factor and a WACC of 10 per
      cent, before and after: CCGT 77.8 to 68.9 $/MWh, gas turbine 109.2 to 90.2, gas
      CHP 119.9 to 104.3, coal 58.9 to 52.6, engines 26.1 to 17.8, nuclear 107.0 to
      106.6. EVERY THERMAL CANDIDATE GETS CHEAPER, which is the honest reading of a
      2025 cost book against a 2020 one, and nuclear barely moves because its CAPEX
      rising by a third is cancelled by sixty years to amortize it over and a variable
      cost that falls from 16.83 to 0.67.
      Capacity, StYr and BuildLimitperYear are untouched, being the shape of the menu
      and not its cost, and so is the DeCA Max Capacity column, which is carried in the
      report and out of the table: it reads like a unit size, 300 MW for a coal or
      combined cycle block and 1200 for a nuclear one, but DeCA never says so and EPM
      reads Capacity as a cumulative build limit, so writing 300 there would silently
      cap all new coal in a country at one block.
      The fixed cost of the EXISTING units is still the 2020 value, DeCA stating none.
    todo: >
      PHASE 6, WHAT THE HEAT RATE REBUILD EXPOSES. DeCA states the ELECTRICAL
      efficiency of a plant, and for a CHP that is only part of the story: Astana-2 at
      0.208 sends most of its fuel to district heat, so charging all of it to
      electricity at 16.40 MMBtu/MWh over-prices the unit, and the flat 11.23 of the
      2020 model was implicitly crediting the heat. EPM carries no heat, so the honest
      repair is not a softer heat rate but a winter must-run. PHASE 7 LOOKED FOR THAT
      LEVER AND IT IS NOT THERE: MinLimitShare is a dead column in this version, read
      by no equation of base.gms or main.gms, and the real must-run switch is
      MinGenCommitment, which base.gms:847 guards with fDispatchMode. It therefore
      binds in an hourly dispatch run and NOT in the expansion, which is what this
      model is. So the Kazakh CHPs stay too far down the merit order for now, and the
      two honest ways out are both later: run the dispatch of phase 8 with
      MinGenCommitment on, or credit the CHPs for their heat inside the heat rate
      itself, which is a phase 9 assumption and not a repair.
      PHASE 6, WHAT IS NOT DONE. FOMperMW of the EXISTING units is still the 2020
      value everywhere. DeCA states no fixed cost for an existing unit at all, only for
      its candidates, and putting a candidate figure on a fifty year old CHP would be
      worse than leaving it.
      A NEW KAZAKH GAS UNIT PAYS NO FUEL TRANSPORT WHERE AN EXISTING ONE DOES, and that
      asymmetry is the one thing the candidate step leaves crooked. Kazakh gas transport
      is regional, 0 on the Atyrau fields to 13.3 at the end of the pipeline, so it sits
      in the VOM of the two existing plants rather than in the price; a candidate has no
      site, so it pays the molecule alone and comes out systematically cheaper to fuel
      than the fleet it competes with. The capacity weighted national mean is 3.851
      $/MMBtu, some 21 $/MWh on a combined cycle, which is not a rounding error. The
      repair is either a zone mean adder on the Kazakh gas candidates or siting them,
      and it wants the Zones_Regions sheet.
      THERMAL CANDIDATES CARRY NO CAPEX TRAJECTORY: only solar, wind and batteries have
      one, so a 2025 combined cycle cost is charged unchanged in 2050. That is defensible
      for mature thermal plant and it is what DeCA states, but it should be said out loud
      rather than left as a silent flat line.
      THE DeCA CANDIDATE MENU IS WIDER THAN THE MODEL USES. CCGT with CCS, coal with
      CCS, ultrasupercritical coal, CCGT on biogas and the dual gas/hydrogen machine are
      all priced in the same sheet and none of them exists as a candidate in this model.
      They are the natural furniture of a decarbonization scenario in phase 9, alongside
      the CCS capture costs the KZ book carries region by region, 13.32 to 19.32 $/tCO2.
      PHASE 5, what is left: the existing fleet against DeCA. Its Thermal PP sheets
      carry 136 units and 51.9 GW over the five countries, where this table has 31.5 GW
      of Central Asian plant of every kind. Whole plants are missing: the 598 MW of
      Tajik thermal, Dushanbe-1 and Dushanbe-2, sits here at zero capacity and retired;
      Bishkek is 666 MW here against 812 MW in DeCA; Turkmenistan is 5.8 GW here against
      7.7 GW. The named hydro candidates stuck at Capacity 0 are the other half of it:
      NARYN, KOKEMEREN-1 and 2, DASHTIJUM, against a DeCA pipeline that carries Rogun at
      3380 MW by 2033, Kambarata-1 at 1860, Kambarata-2 at 240, Kulanak at 100, Pskem at
      404, Mullalak at 240, an uprating of Nurek of 385 and of Kayrakum of 48. Those are
      project decisions, not a rule, so they go one by one in a mapping of their own.
      DeCA also caps its own solar and wind candidates by region, Max. Capacity (MW) in
      Renewable PP Candidates. That is a resource limit and not a connection rate, and it
      is not used here because it is stated per oblast and not per model zone.


  pAvailability:
    path: supply/pAvailabilityCustom.csv
    group: Fleet
    action: table
    from: extracted/pAvailabilityCustom.csv    # produced by build_hydro.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: medium
    sheet: >
      HydroPP + Hydro Profile, Reference hydrology
    vintage: "2025"
    what: >
      seasonal availability by plant, 403 units x 4 seasons
    note: >
      Rebuilt by build_hydro.py from data_build/mappings/hydro_plants.csv, which
      carries the 134 hydro units of the model one by one, and from
      data_build/mappings/seasons_months.csv, which says which months each season
      holds. 45 units out of 134 now rest on DeCA: 11 take its monthly profile
      directly, the 5 Kazakh plants whose profile is plant-specific and the Pskem and
      Upper Naryn candidates; 34 keep the 2020 seasonal shape, which describes the
      reservoir operation, and have their level brought back to the DeCA capacity
      factor. THE 2020 MODEL WAS OPTIMISTIC ON CENTRAL ASIAN HYDRO: it allowed
      Toktogul 1.64 times, Uch-Kurgan 1.71 times and Charvak 1.75 times the energy
      DeCA gives them. The seasonal availability is the water constraint of the model,
      base.gms:806 caps the energy of a season with it, so that gap was a gift of
      water. Kazakhstan runs the other way, DeCA being more generous than 2020 on
      Bukhtarma and Ust-Kamenogorsk. The 89 remaining units keep their 2020 values,
      each with its reason in the mapping.
      The peak column of the 2020 model is gone with the peak season, see pHours. It
      carried a convention, 267 plants out of 403 at Q5 = 1.0 and 313 valued above their
      Q1, that is firm capacity at the peak. PHASE 7 SETTLED WHAT BECOMES OF IT: the convention is
      not restored, the credit stays at the real 0.85, and the consequence is measured
      in pPlanningReserveMarginZone.
      PHASE 7 ALSO CLOSED A HOLE THIS BUILD HAD OPENED ITSELF. The 2020 table covered
      its 403 units exactly; the 16 solar and wind candidates added from 2031 had no
      line, and a generator absent from pAvailability is not defaulted to one, it is
      READ AS ZERO, base.gms:812 then writing vPwrOut = 0 over the whole horizon. Solar
      was rescued by the generic fallback of the model, which carries a PV/Solar line;
      wind was not, its technology being WT here and OnshoreWind there, so EIGHT WIND
      CANDIDATES COULD BE BUILT AND WOULD HAVE PRODUCED NOTHING. build_hydro.py now
      completes the table against the fleet, giving a missing unit what its own
      technology and fuel carry elsewhere by majority, and refusing to guess on a tie
      or on a pair it has never seen. RUN ORDER IS build_fleet.py THEN build_hydro.py.
    todo: >
      1. Kambarata-2, Rogun and Shardara have a DeCA yearly production above their own
      capacity, the production of the full project against one unit, so their level
      could not be used. 2. Farhad is carried at 311 MW here against 126 MW in DeCA,
      and its DeCA production gives an annual 0.02: the plant identity has to be
      settled in phase 5. 3. Pakistan, 41 units, and Afghanistan, 15 units, are
      outside the DeCA perimeter and still rest on the 2020 model: they need the NTDC
      IGCEP and the DABS fleet. 4. The dry and wet hydrologies are in the same sheets,
      read with --scenario, and are waiting for the scenario phase.

