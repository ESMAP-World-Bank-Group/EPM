# Build of the EPM Central Asia 2026 input set.
#
#   python data_build/build.py   --config data_build/build_casa.yaml --check
#   python data_build/build.py   --config data_build/build_casa.yaml --apply
#   python data_build/tracker.py --config data_build/build_casa.yaml
#   python data_build/docs.py    --config data_build/build_casa.yaml
#
# THE ONLY HAND-EDITED FILE of the chain. The target folder is REPRODUCED from this
# file; the tracking workbook and the documentation page are DERIVED from it. Neither
# is edited by hand, so neither can drift away from what was actually done. Any
# resource absent from the "resources" list is carried over as is from the 2020
# reference.

deployment:
  source: epm/input/data_casa_2020      # faithful port of the EPM v7.9 model, December 2020
  target: epm/input/data_casa           # what we build
  datapackage: epm/input/datapackage.json


# -- The sources, described once ----------------------------------------------
# Raw files are not versioned (large, often confidential): the "where" field says
# where to find them, "access" governs what may leave the Bank, and "covers" lists
# the country codes the source can speak for. Those codes are the ones used by
# zcmap.csv, so the coverage matrix of the documentation page needs no hard-coded
# country list. Paths relative to ca_2026/ unless stated otherwise.
#
# "grade" and "date" together are what the documentation page grades a cell of the
# coverage matrix with, so that a country read from the 2025 study and a country
# read from the 2020 model do not come out the same colour. Three grades only:
#   primary      a source dedicated to that country, collected for a study
#   secondary    an earlier model, a derived product, or a pre-filled template
#                that nobody has validated yet
#   placeholder  no data behind it: an assumption, a team decision, a request
#                that has not been answered
# A placeholder is never current whatever its date, which is the trap this field
# exists to close: "assumed" is dated 2026 and would otherwise read as fresh data.
# "ages: false" marks a source with no meaningful vintage, combustion chemistry
# being the case at hand: it is not stale, it is simply not dated.

sources:

  casa_2020:
    name: EPM CASA model v7.9, ported and validated
    date: 2020-12
    access: internal_wb
    grade: secondary
    where: EPM/epm/input/data_casa_2020
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Only source for Afghanistan and Pakistan: that is why the build starts from a
      copy rather than from a blank slate. Port validated (demand, generation,
      unserved energy and corridors identical to the legacy run). The 2020 assumptions
      are stale and the load profile is of 2013 vintage. Covers 16 zones and 7
      countries over 2017-2030.

  deca_v51:
    name: DeCA / Mercados AssumptionBooks V5.1
    date: 2025-03-06
    access: internal_wb
    grade: primary
    where: data_collection/Mercados/
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      One workbook per country. KG 20 sheets (8760 h demand North/South, hydro
      cascade). KZ 18 sheets, 8760 h demand PER OBLAST (14) plus North/South/West
      aggregates, Demand Evolution in two scenarios Reference and Net Zero, sheet
      Exchanges with non CA countries; intra-Central-Asian exchanges are absent. TJ 18
      sheets, 8760 h demand North/South (2021), sheet Exchanges: CASA-1000 DC link 300
      MW from 2026 with a May-September export window, TJ to AF Sangtuda-Kunduz 300
      MW, existing PPA 188 MW; no detail on Rogun. TM 13 sheets, no hydro, and
      DEGRADED DEMAND: average day per month only (~288 points), with no regional
      breakdown. UZ 19 sheets, 8760 h demand over 5 zones, sheet Fuel Availability
      unique among the five books.

  uz_climate_2026:
    name: UZ Climate AssumptionBook (WB/MAI)
    date: 2026-07-09
    access: internal_wb
    grade: primary
    where: data_collection/Mercados/20260709_UZ_CC_AssumptionBook_WB_MAI.xlsb
    covers: [UZB]
    note: >
      Sixteen months later than the V5.1 books, hence takes precedence over them for
      UZB. Format .xlsb, read through pyxlsb.

  template_2026:
    name: 2026 template, CASA CENTRAL ASIA DATA REQUEST
    date: 2026
    access: internal_wb
    grade: secondary
    where: Context/opening_emails/
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      25 sheets (5 themes x 5 countries), ALREADY PRE-FILLED with the cleaned 2020
      data, zones as free-text labels. This is the official validation channel through
      the country TTLs. Pre-filled is not validated. Covers NEITHER Afghanistan NOR
      Pakistan.

  ttl_2026:
    name: Country feedback from the TTL team, 2026 campaign
    date: 2026
    access: internal_wb
    grade: primary
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      Takes precedence over DeCA and over the 2020 model where available. Fleet
      additions dated 2023+ inherited from 2020 are PROJECTS, not facts: TTL review is
      mandatory before keeping them.

  casa1000_ppa:
    name: CASA_PPA_Quantities_All_4_Flows.xlsx
    date: 2026
    access: client_confidential
    grade: placeholder      # not obtained yet: a request, not a source in hand
    where: (to be located)
    covers: [AFG, KGZ, PAK, TAJ]
    note: Contractual quantities of the 4 flows, to be attached to pContractedTradeEnergy.

  epmresults_legacy:
    name: EPMRESULTS.xlsx, results of the legacy model
    date: 2020
    access: internal_wb
    grade: secondary
    where: planning_sharefolder/casa_planning_sharefolder/CASA/1. Model/
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: Non-regression reference for the port. A warning signal, not an acceptance criterion.

  pak_sharefolder:
    name: Pakistan planning sharefolder
    date: 2018
    access: internal_wb
    grade: primary
    where: planning_sharefolder/pakistan_planning_sharefolder/
    covers: [PAK]
    note: >
      NTDC, Lahmeyer, SNC Lavalin master plan. MAJOR GAP: 8 years old, IGCEP missing,
      while Pakistan weighs 155 TWh, that is 38 % of the demand of the model.

  afg_sharefolder:
    name: Afghanistan planning sharefolder
    date: 2021
    access: internal_wb
    grade: primary
    where: planning_sharefolder/afghanistan_planning_sharefolder/
    covers: [AFG]
    note: >
      AFGDISPATCH.gms and .xlsx. MAJOR GAP: earlier than 2021, no reliable alternative
      source outside Global Energy Monitor.

  mercados_plexos:
    name: Mercados report and the associated PLEXOS model
    date: 2025
    access: internal_wb
    grade: placeholder      # same study as the books, other deliverable, not obtained
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      Same consultant and same 2025 study as the AssumptionBooks, a DIFFERENT
      deliverable: the report and the PLEXOS database behind it. We hold the five
      Excel books, not the model. Graded a placeholder for that reason.

  renewables_ninja:
    name: Renewables.ninja / ERA5
    date: 2026
    access: open_source
    grade: secondary
    where: renewables.ninja
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Hourly solar and wind profiles by coordinates. Already used by
      pre-analysis/pipelines/vre_pipeline.py.

  epa_ghg_factors:
    name: US EPA greenhouse gas emission factors for stationary combustion
    date: 2014
    access: open_source
    grade: primary
    ages: false
    where: epa.gov, Emission Factors for Greenhouse Gas Inventories
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Combustion chemistry rather than country data, hence covers everything: natural
      gas 53.06 kg CO2 per MMBtu, sub-bituminous coal 97.17, residual fuel oil No. 6
      75.10. These are the values pFuelCarbonContent has always carried; naming the
      source only makes visible what was already there.

  tso_request:
    name: Direct request to the transmission system operators
    date: 2026
    access: internal_wb
    grade: placeholder
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: NTCs and commissioning schedules of the corridors. Not started to date.

  team:
    name: Modelling team decision
    date: 2026
    access: internal_wb
    grade: placeholder
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]

  assumed:
    name: No source - assumption made
    date: 2026
    access: assumption
    grade: placeholder
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      To be made explicit in the methodology note: every value carried here is to be
      justified or replaced.

  team_emails:
    name: CASA team emails
    date: 2026-08
    access: internal_wb
    grade: secondary
    where: Context/opening_emails/
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Mandated validation channel: Mercados, then template, then TTL review, then EPM.
      INTERNAL exercise, not to be shared externally (Kabir Malik, 5 August 2026).


# -- Leads on public sources, tested on 19 August 2026 -------------------------
# Purely informative: this block does not drive the build, it feeds the workbook.
# It lists only sources ACCESSIBLE ONLINE, without a prior request, and the status
# says what the test returned, not what we hoped to find there.
# [country, organisation, address, status, what was found, what we do with it]

leads:
  - [Pakistan, "NTDC / ISMO - IGCEP 2025-35", "nepra.org.pk/Admission Notices/2025/08 Aug/IGCEP_2025-35_R2.pdf", "TESTED - AVAILABLE", "Free 320-page PDF, May 2025: demand in 3 scenarios out to 2035 (GWh and MW), fleet unit by unit, candidates dated and costed, efficiencies, load factors. 43,069 MW in 2024, 64,035 MW targeted in 2035.", "PRIORITY 1. Replaces the 2018 sharefolder on its own. Two treatments needed: extend 2035 to 2050, and write the mapping from the 11 DISCOs to our 3 PAK zones."]
  - [Pakistan, "NTDC - IGCEP 2024-34", "nepra.org.pk/Admission Notices/2024/05 May/IGCEP 2024-34 Report.pdf", "TESTED - AVAILABLE", "239 pages, April 2024. Annex A consumption by category, annex B fleet as of 30 June 2023 and candidate costs, annexes C-F demand scenarios.", "Control vintage: the gap between the two editions reveals the schedule slippage of the large dams."]
  - [Pakistan, "NEPRA - State of Industry Report 2025", nepra.org.pk/publications, "TESTED - AVAILABLE", "Annual review, published January 2026: actual generation, losses by distributor, collection, tariffs.", "Direct source for pLossFactor and calibration of the observed year."]
  - [Kazakhstan, "KEGOC - integrated annual reports", "ar2024.kegoc.kz, ar2023.kegoc.kz", "TESTED - AVAILABLE", "Electricity balance and PEAK BROKEN DOWN BY ZONE North/South/West, exactly our split. Peak of 27/12/2025 at 18h: 17,540 MW (N 10,645, S 4,403, W 2,492). Consumption 2025: 124,606.5 GWh.", "EXTERNAL VALIDATION ALREADY DONE: our coincident 2026 peak comes out at 17,886 MW, that is +2.0 %, one year of growth. The only model parameter validated from the outside."]
  - [Kazakhstan, "Nodal dataset (Data in Brief, CC BY)", "pmc.ncbi.nlm.nih.gov/articles/PMC6661261", "TESTED - AVAILABLE", "193 lines 220-1150 kV with parameters, 24 load centres, nodal hourly demand over one summer week and one winter week, power plants with efficiency and availability. 2015 vintage.", "The only open nodal dataset of the region. Indispensable if a third KAZ_W zone is created; to be treated as a topology, not as a level."]
  - [Kazakhstan, "KEGOC wholesale market, Bureau of National Statistics", "kegoc.kz, stat.gov.kz", "TESTED - PARTIAL", "Market analyses H1 2025, energy balance in IEA format. No raw time series: the hourly data of the balancing market stays internal.", "Sector framing. Does not fill the need for an hourly profile."]
  - [Tajikistan, "World Bank - MPA Rogun P181029", "documents.worldbank.org", "TESTED - AVAILABLE", "Approval of 17/12/2024. Explicit phasing: 1,660 MW by 2028 (level 1,185 m), 3,780 MW in 2035 in six 630 MW units (level 1,300 m), output ~14,400 GWh/yr.", "Directly corrects the inherited fleet, which places six 600 MW units all dated 2031, an assumption disguised as a schedule. High leverage: Rogun is the largest capacity item of the model."]
  - [Tajikistan, "IEA / OECD - sector reviews", "iea.org/reports", "TESTED - AVAILABLE", "2022 sector review funded by the EU and cross-border trade roadmap: fleet, winter constraints, structure of exports.", "Qualifies Tajik seasonality, translated into pTransferLimit and hydro availability."]
  - [Tajikistan, "Barqi Tojik, Agency on Statistics", stat.tj, "TESTED - NOTHING", "No energy balance nor annual report freely downloadable. The Tajik figures in circulation all come from intermediaries.", "To go through the TTL channel. That is where the share of Sughd in national consumption would be settled."]
  - [Kyrgyzstan, "National Statistical Committee - fuel and energy balance", "stat.gov.kg/en/publications/toplivno-energeticheskij-balans", "TESTED - AVAILABLE", "Annual energy balance in Excel, layout inherited from the USSR; monthly generation and exchange data also collected.", "Sector calibration of Kyrgyz demand and independent check of the North/South split."]
  - [Kyrgyzstan, "Open Data portal", "stat.gov.kg/en/opendata", "TESTED - NOTHING", "22 categories in JSON, XML and Excel under CC BY-NC-SA 4.0, but NO energy or electricity category.", "Irrelevant to the model: the energy balance is a separate publication, outside the portal."]
  - [Uzbekistan, "stat.uz (SDMX) and data.egov.uz", "stat.uz, data.egov.uz", "TESTED - PARTIAL", "SDMX-standard portal, more than 2,000 official indicators with metadata; separate national open data portal. Energy section present.", "The best equipped technically in the region, machine access possible. The useful electricity series remain to be identified: NOT DONE."]
  - [Uzbekistan, "Energy strategy 2030 (via the IEA profile)", "iea.org/reports/uzbekistan-energy-profile", "TESTED - AVAILABLE", "Official targets: >120 TWh and 54 % renewable in 2030, 27 GW of RE. Capacity ~25.8 GW end 2025 of which 8 GW RE, generation 86.7 TWh in 2025.", "Scenario framing and upper bound on pMaxNewCapacity for RE. These are policy targets: to be treated as such."]
  - [Turkmenistan, "Turkmenenergo, state statistics", "-", "TESTED - NOTHING", "No accessible official publication. Third-party estimates only: ~7.1 GW gas-fired, ~44.8 TWh in 2024, no RE capacity in 2025.", "The DeCA TM book, degraded as it is (average day per month, no regional resolution), remains the best source. Assumptions to be made explicit in the methodology note."]
  - [Afghanistan, "DABS, NSIA, UN Energy Statistics", "unstats.un.org/unsd/energystats", "TESTED - NOTHING", "No regular statistical publication since 2021. Scattered elements: ~670 MW imported for ~280 M USD/yr according to DABS, imports of 4.6 to 5.2 TWh over 2017-2022 according to the UN, private sector overview of November 2025.", "Enough to recalibrate the LEVEL of Afghan imports, not to rebuild a zonal demand. The five NEPS zones stay as they came from the 2020 model, low confidence assumed."]
  - [Regional, "Ember - Monthly and Yearly Electricity Data", "ember-energy.org/data/monthly-electricity-data", "TESTED - AVAILABLE", "Generation by technology, demand, capacity and emissions MONTHLY for 85 geographies including our seven countries, up to April 2026. Free download.", "Four years of actuals that DeCA does not have: the history of the books stops in 2022. Base year calibration and the only homogeneous dataset over the seven countries."]
  - [Regional, "Global Energy Monitor - Global Integrated Power Tracker", "globalenergymonitor.org/projects/global-integrated-power-tracker/download-data", "TESTED - AVAILABLE", "Global fleet unit by unit, geolocated, with status and dates. AN AUGUST 2026 RELEASE IS OUT; we hold the September 2025 one.", "Immediate refresh of the fleet, and the only coverage of AFG and PAK alongside IGCEP. Tajikistan is under-represented there: complete with DeCA."]
  - [Regional, "Renewables.ninja, Global Wind Atlas, atlite/ERA5", "renewables.ninja, globalwindatlas.info", "TESTED - AVAILABLE", "Hourly solar and wind profiles simulated anywhere on the globe from the ERA5 reanalysis.", "The only route to pVREProfile in Turkmenistan, in Afghanistan and wherever DeCA gives nothing. Already wired into pre-analysis/pipelines/vre_pipeline.py."]
  - [Regional, "gridfinder, OpenStreetMap power, energydata.info", "energydata.info, gridfinder.rdrn.me", "TESTED - PARTIAL", "Global map of lines predicted from night lights and OSM (grid.gpkg, targets.tif), announced accuracy ~70 % at 1 km.", "TOPOLOGY check only: confirm that a corridor exists and where it runs. GIVES NO NTC, transfer capacities still have to be requested from the operators."]
  - [Regional, "IEA country profiles, UN Comtrade, OWID", "iea.org/countries, comtradeplus.un.org", "TESTED - PARTIAL", "National energy balances as free PDFs, electricity flows declared at customs by country pair, long consumption series.", "Cross-check of historical exchanges. Comtrade is of uneven quality in Central Asia: not to be used alone."]
  - [Regional, "CASA-1000 - project documents", "-", "NOT TESTED", "Schedule, contractual quantities, export seasonality.", "Indispensable to correct pTransferLimit and pContractedTrade."]
  - [Kyrgyzstan, "Electric Power Plants OJSC / NESK", "-", "NOT TESTED", "Generation of the Naryn cascade, level of Toktogul.", "The level of Toktogul is THE variable to watch for the winter balance."]
  - [Uzbekistan, "National Electric Grid of Uzbekistan", "-", "NOT TESTED", "Grid and regional exchanges.", "UZB is the pivot of the CAPS: it is its internal NTCs that condition any future split."]


# -- What we do, resource by resource -----------------------------------------
# path      relative path inside the deployment folder
# action    BUILD verb (keep by default): what the script does today
# work      REMAINING work, tracking vocabulary: EXTEND, FILL, REBUILD...
# priority  P1 blocking, P2 needed, P3 optional
# source    keys of the "sources" block above
# note      what was done, and why
# todo      what is left, prefixed by the phase
resources:

  # ---- Scope -------------------------------------------------------------
  y:
    path: y.csv
    group: Scope
    action: rows
    rows: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2040, 2045, 2050]
    work: EXTEND
    priority: P1
    source: ["team"]
    confidence: high
    what: >
      horizon 2017-2030
    note: >
      Horizon 2050. Yearly step until 2035 to follow the ramp-up of Rogun, then a
      5-year step. pWeightYear is derived from the gaps (main.gms:718).
    todo: >
      DONE (phase 1): horizon 2026-2050, yearly from 2026 to 2035 then a 5-year step
      (2040, 2045, 2050), that is 13 years. The yearly step until 2035 covers the
      ramp-up of Rogun. pWeightYear is derived automatically from the gaps
      (main.gms:718), nothing else to enter.

  zcmap:
    path: zcmap.csv
    group: Scope
    action: keep
    work: DECIDE
    priority: P1
    source: ["deca_v51"]
    confidence: high
    sheet: >
      Zones_Regions (5 countries)
    vintage: "2025"
    what: >
      16 zones -> 7 countries
    todo: >
      Keep the 16 zones. The 5 Afghan nodes are not accounting artefacts but radial
      islands, each synchronous with a different neighbour, that pTransferLimit
      interconnects progressively towards 2030: merging them would invent a capacity
      that does not exist. The only useful move is to rename them geographically.

  pSettings:
    path: pSettings.csv
    group: Scope
    action: set
    key: Abbreviation
    value: Value
    set:
      fUseSimplifiedDemand: 1
      fEnableStorage: 1
    work: REVISE
    priority: P1
    source: ["casa_2020", "team"]
    vintage: "2020"
    what: >
      ~40 flags and scalars, one of them set by the build
    note: >
      PHASE 8 TURNED fUseSimplifiedDemand ON, which is the only value the build
      overrides: the other forty are the 2020 ones and are kept as they are, the verb
      editing single cells rather than rewriting the file. At 1 the model reads
      pDemandProfile and pDemandForecast and builds pDemandData itself by the NLP at
      generate_demand.gms:63. At 0 it would read pDemandData, which is empty by design.
      See pDemandProfile for the two routes and why this one was taken.
    todo: >
      PHASE 7 SETTLED THE RESERVE FLAGS, all of them by leaving them where they are:
      fApplyZonalPlanningReserve on and fApplyPlanningReserveConstraint on with an
      empty country margin, which is the 2020 formulation; both spinning reserve flags
      off, DeCA holding no operating reserve either. See pPlanningReserveMarginZone
      and pSpinningReserveReqCountry.
      TWO TRAPS FOUND AND LEFT IN PLACE BECAUSE THEY ARE INERT TODAY.
      1. sPeakLoadProximityThreshold IS EMPTY, hence zero, and main.gms:677 tests a
      strict inequality against it, so pAllHours is zero everywhere and main.gms:686
      gives EVERY SOLAR AND WIND UNIT A CAPACITY CREDIT OF ZERO. It costs nothing
      today, pCapacityCredit feeding only the country and system reserves which
      generate no row here, but anyone switching to a country reserve in phase 9 would
      silently be telling the model that renewables are worth no firm capacity at all.
      2. fUseSimplifiedDemand SETTLED BY PHASE 8 AND NOW AT 1, the profile being built.
      The trap it was is worth remembering: at 0 the model reads pDemandData and at 1 it
      rebuilds it out of pDemandProfile, and until phase 8 BOTH were empty, so the model
      had no demand at all whichever way the flag was set.
      PHASE 5 TURNED fEnableStorage ON, the second value the build overrides. The
      eight four-hour battery candidates of pStorageDataInput were written in phase 4
      and were dead while the flag was 0: base.gms only generates the storage balance,
      the charge and the state-of-charge equations under it, so the rows were read and
      then never entered an equation. The vocabulary was never the obstacle,
      Storage/Battery having been in pTechFuel since 2020: the switch was.
      Still to be settled elsewhere: carbon (OFF, phase 9), ramps (OFF), MinGen and
      MUDT (OFF, dispatch only).

  config:
    path: config.csv
    group: Scope
    action: keep
    work: KEEP
    priority: P2
    source: ["casa_2020"]
    vintage: "2020"
    what: >
      modeltype RMIP + cplex options
    note: >
      Switch to MIP only if unit commitment is turned on.

  pHours:
    path: pHours.csv
    group: Scope
    action: table
    from: extracted/pHours.csv                 # produced by build_demand.py
    work: DONE
    priority: P3
    source: ["deca_v51", "team"]
    confidence: high
    sheet: >
      DeCA Demand Profile 8760h
    vintage: "2021-2022"
    what: >
      5 seasons x 3 representative days x 24 chronological hours = 360 blocks, 8760 h
    note: >
      q = 4 quarters, the 5th peak season is removed. It was not a structure but a
      patch: the reserve constraint takes a smax over all blocks (base.gms:991) and
      requires no dedicated season. Q5 only served to give that smax a block short
      enough to see the true peak, for want of representative days (d=1 in the 2020
      model).
      THE SEASONS ARE NOT CALENDAR QUARTERS, and the months behind them are written
      down in data_build/mappings/seasons_months.csv, which is the single place the
      year is cut: Q1 December to February, Q2 March and April, Q3 May and June, Q5
      July to September, Q4 October and November. The first cut was read off the 2020
      durations, Q1 and the peak block together 2180 h that is 90.8 days, Q2 1464 h
      exactly 61 days, Q3 3652 h that is 152.2 days, Q4 1464 h exactly 61 days, and it
      lands on 8760 h to the hour. Every season-indexed resource is built against that
      mapping.
      PHASE 4 SPLIT THE SUMMER IN TWO, May-June against July-September. One season of
      five months held two different things at once: the irrigation release, where the
      reservoirs open for the fields downstream and the hydro runs whether the load
      calls for it or not, and the cooling peak, where it is the load that is high. A
      single season had to pick one, and it picked the peak: its representative days
      were 24 July and two medians drawn from a five-month pool. They are now 27 June
      for Q3 and 24 July for Q5, and May-June has its own shape at last.
      THE NAME Q5 IS RECYCLED, not restored. The 2020 model had a Q5 too and it was
      the 130 h peak block, not a season. Nothing of that block is here. The seasons
      mapping carries a legacy column saying which 2020 season each of ours draws its
      inherited shapes from, and ours sends both halves of the summer to the 2020 Q3;
      without it build_vre matched on the name alone and dressed July-September in a
      winter peak block, which input_verification.py caught as a capacity factor of
      1.24 on KAZ_N solar.
      NO SEASON IS NAMED ANYWHERE ELSE. The CASA-1000 contract window and the seasonal
      corridor to Afghanistan are written in months in their own mappings and resolved
      against this file, so the year can be re-cut again without touching them; a
      window that would take part of a season stops the build rather than being
      guessed at.
      PHASE 8 REBUILT IT, and this is the file that defines the sets q, d and t for
      the whole model: main.gms:214 reads pHours(q<,d<,t<), so every other hourly
      resource follows whatever shape is written here. It is now four seasons by three
      representative days by twenty four chronological hours, the canonical EPM shape
      that epm/input/data_test also carries, and each cell holds THE NUMBER OF DAYS the
      representative day stands for, repeated over its 24 hours, summing to 8760.
      THE PEAK REPRESENTATIVE DAY REPLACES THE OLD PEAK SEASON. In each season d1 is a
      calendar day and weighs one day, which is what base.gms needs when it takes an
      smax over (q,d,t) for the reserve. The day chosen is the one that stresses the
      most zones at once, each zone counted against its own maximum rather than in
      megawatts, because a sum in megawatts is decided by Kazakhstan and Uzbekistan
      alone and the reserve of EPM is written per zone. The five days are 12 December,
      1 March, 27 June, 24 July and 21 November.
      THE OTHER TWO ARE REAL DAYS AS WELL, AND THEIR WEIGHTS ARE SOLVED, NOT COUNTED.
      The rest of the season is split in two by daily energy and each half is
      represented by its medoid, the real day closest to the average of that half. A
      medoid is the most typical day of its group and not the day carrying its average
      energy, so the two weights are then solved rather than taken from the sizes of the
      groups: two unknowns, two equations, the days of the season and the energy of the
      season, rounded to whole days at the end because input_verification.py compares
      the sum of this table to 8760 with no tolerance at all and refuses a block of zero
      hours. The weights that come out are 53 and 36 days for Q1, 28 and 32 for Q2, 31
      and 29 for Q3, 42 and 49 for Q5, 29 and 31 for Q4.
      WHY NOT THE MEAN OF EACH GROUP, WHICH IS WHAT THIS STEP DID FIRST. Averaging
      seventy-six days flattens every trough that does not fall at the same hour twice,
      and the model reads that flattening as a baseload the system does not have. See
      pDemandProfile, which carries the measurement and the table of it.
      The season durations are 90 / 61 / 61 / 92 / 61 days, and every seasonal resource
      is rebuilt from them: pDemandProfile, pVREProfile, pAvailability, pTransferLimit,
      pContractedTradeFlag and pContractedTradeEnergy.
    check:
      from: extracted/demand_report.csv
      note: >
        Written by build_demand.py: the date each representative day actually is, how
        many days of its season it stands for, and how many days were in the group it
        was drawn from. The two counts differ because the weights are solved on the
        energy of the season, not read off the sizes.
    todo: >
      THE NUMBER OF REPRESENTATIVE DAYS IS ONE ARGUMENT, --days, and three is a
      starting point rather than a result: the model went from 35 blocks in 2020 to 288
      here, and if the solve turns out to be comfortable the count should go up, the
      days being grouped by demand alone today and therefore carrying no renewable
      variability. See pVREProfile, where the same limit bites harder.
      THE WEIGHT SOLVER IS EXACT FOR TWO GROUPS AND LEAST SQUARES BEYOND, so raising
      --days above three leaves a residual on the energy of the season. It is reported
      in the demand test and it is small; it would be removed by adding a third
      condition, the peak of each group, rather than by another solver.
      PHASE 4 SPLIT THE SUMMER: Q3 is May-June, the irrigation release, and Q5 is
      July-September, the cooling peak. 360 blocks now instead of 288. It shows in
      the representative days, which no longer share one: Q3 peaks on 27 June and Q5
      on 24 July, where the single five-month season kept only 24 July and drowned
      May-June in two median days. The contract window did not move, it is written in
      months now and spans the two seasons.

  pTechFuel:
    path: pTechFuel.csv
    group: Scope
    action: rows
    rows:
      - [CHP, Gas, 0, 0, 1]
      - [CCGT, Gas, 0, 0, 1]
      - [ST, Coal, 0, 0, 7]
      - [CHP, Coal_KAZ_S, 0, 0, 15]
      - [CHP, Coal, 0, 0, 7]
      - [ICE, HFO, 0, 0, 2]
      - [ST, Gas, 0, 0, 1]
      - [ST, HFO, 0, 0, 2]
      - [CHP, HFO, 0, 0, 2]
      - [CCGT, HFO, 0, 0, 2]
      - [HY, Water, 0, 1, 9]
      - [ST, LNG, 0, 0, 6]
      - [CCGT, LNG, 0, 0, 6]
      - [GT, Gas, 0, 0, 1]
      - [GT, LNG, 0, 0, 6]
      - [ST, UR, 0, 0, 14]
      - [PV, Solar, 1, 1, 11]
      - [ICE, LNG, 0, 0, 6]
      - [WT, Wind, 1, 1, 12]
      - [ST, Coal_KAZ_S, 0, 0, 15]
      - [INT, Import, 0, 0, 8]
      - [CSPPlant, CSP, 0, 1, 13]
      - [PVwSTO, Solar, 1, 1, 11]
      - [STOPV, Solar, 0, 1, 11]
      - [Storage, Battery, 0, 0, 16]
      - [ROR, Water, 1, 1, 9]
    work: REVISE
    priority: P2
    source: ["casa_2020", "epm_resources"]
    confidence: high
    vintage: "2020, two flags corrected in 2026"
    what: >
      26 tech/fuel pairs, two of them wrongly flagged
    note: >
      THIS TABLE IS THE VOCABULARY OF THE MODEL. main.gms:169 declares the tech and f
      sets from it and from nothing else, main.gms:598 and 601 read HourlyVariation to
      build the VRE set and RETechnology to build the RE set, and base.gms:811 then
      writes a different equation for a unit inside the VRE set than for one outside
      it. A wrong flag here is not a label, it is a change of formulation.
      TWO WERE WRONG AND ARE CORRECTED, both against the EPM reference vocabulary in
      epm/resources/pTechFuel.csv.
      1. INT/Import CARRIED HourlyVariation 1, so every import contract landed in the
      VRE set and base.gms:811 forced its output to pVREgenProfile x availability x
      capacity. pVREProfile holds solar and wind only, so the profile of an import is
      zero and the equation reads: produce nothing, every hour of every year. The
      model has one such unit, IRAN_Import, 400 MW into NEPS_HERAT, and the solved run
      confirms it: pPlantMerged carries its 400 MW of capacity in all 13 years and not
      one row of energy. The 2020 model had the same flag and the same silence. At 0
      it becomes what it is, a dispatchable 400 MW at 70 USD/MWh, availability 0.9.
      The reference calls the technology ImportTransmission and flags it 0,0.
      2. HY/Water CARRIED RETechnology 0, so no hydro of the model counted as
      renewable. It is inert today, base.gms:786 firing only when a renewable target
      is set and sMinRenewableSharePct being 0, but it would have quietly halved the
      renewable share of any target scenario. The reference flags ReservoirHydro/Water
      1. HourlyVariation stays 0: reservoir hydro is dispatched against its seasonal
      availability, not against an hourly profile.
      FOUR ROWS ARE USED BY NO UNIT and are kept all the same, aligned on the
      reference: CSPPlant/CSP, PVwSTO/Solar, STOPV/Solar and ROR/Water. They are not
      spare labels. main.gms:604-625 names those four strings literally to build the
      cs, so, stp and ror sets, and the strings exist only because this table declares
      them; deleting the rows would stop the compilation.
      Storage/Battery WAS ALREADY HERE and needed nothing. What the eight battery
      candidates were missing was not a vocabulary entry but the switch, and phase 5
      turned it on: see fEnableStorage in pSettings.
    todo: >
      PHASE 9: the DeCA candidate menu this model has no vocabulary for, CCGT with
      CCS, coal with CCS, ultrasupercritical coal, CCGT on biogas and the dual
      gas/hydrogen machine. Each needs a row here before it can need anything else.

  pFuelCarbonContent:
    path: pFuelCarbonContent.csv
    group: Scope
    action: keep
    work: KEEP
    priority: P3
    source: ["casa_2020", "epa_ghg_factors"]
    vintage: "EPA factors, stable since 2014"
    what: >
      CO2 factors by fuel, tCO2 per MMBtu
    note: >
      PHASE 6.4 checked and sourced, and nothing moves. The table is not a CASA
      estimate at all, it is the EPA emission factor set read off the standard
      table: natural gas 53.06 kg CO2 per MMBtu, sub-bituminous coal 97.17,
      residual fuel oil No. 6 75.10, which are the 0.05306, 0.09717 and 0.0751 of
      this file to the last digit. They are combustion chemistry rather than
      country data, so no DeCA book could improve them and none of the five tries.
      Coal_KAZ_S carries the same factor as Coal, both being the sub-bituminous
      line; the two are separated by their price and their transport, not by their
      carbon.
      Import = 0 IS AN ASSUMPTION AND NOT A FACT: electricity imported from
      outside the sixteen zones is counted as emitting nothing, so any accounting
      that leans on it will flatter a zone that imports. It is the right default
      here, the model having no view of what is on the other side of an external
      tie, but a national footprint drawn from these results has to say so.


