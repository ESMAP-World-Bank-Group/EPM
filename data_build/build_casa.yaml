# Build of the EPM Central Asia 2026 input set.
#
#   python data_build/build.py   --config data_build/build_casa.yaml --check
#   python data_build/build.py   --config data_build/build_casa.yaml --apply
#   python data_build/tracker.py --config data_build/build_casa.yaml
#   python data_build/docs.py    --config data_build/build_casa.yaml
#
# THE ONLY HAND-EDITED FILE of the chain. The target folder is REPRODUCED from this
# file; the tracking workbook and the documentation page are DERIVED from it. Neither
# is edited by hand, so neither can drift away from what was actually done. Any
# resource absent from the "resources" list is carried over as is from the 2020
# reference.

deployment:
  source: epm/input/data_casa_2020      # faithful port of the EPM v7.9 model, December 2020
  target: epm/input/data_casa           # what we build
  datapackage: epm/input/datapackage.json


# -- The sources, described once ----------------------------------------------
# Raw files are not versioned (large, often confidential): the "where" field says
# where to find them, "access" governs what may leave the Bank, and "covers" lists
# the country codes the source can speak for. Those codes are the ones used by
# zcmap.csv, so the coverage matrix of the documentation page needs no hard-coded
# country list. Paths relative to ca_2026/ unless stated otherwise.

sources:

  casa_2020:
    name: EPM CASA model v7.9, ported and validated
    date: 2020-12
    access: internal_wb
    where: EPM/epm/input/data_casa_2020
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Only source for Afghanistan and Pakistan: that is why the build starts from a
      copy rather than from a blank slate. Port validated (demand, generation,
      unserved energy and corridors identical to the legacy run). The 2020 assumptions
      are stale and the load profile is of 2013 vintage. Covers 16 zones and 7
      countries over 2017-2030.

  deca_v51:
    name: DeCA / Mercados AssumptionBooks V5.1
    date: 2025-03-06
    access: internal_wb
    where: data_collection/Mercados/
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      One workbook per country. KG 20 sheets (8760 h demand North/South, hydro
      cascade). KZ 18 sheets, 8760 h demand PER OBLAST (14) plus North/South/West
      aggregates, Demand Evolution in two scenarios Reference and Net Zero, sheet
      Exchanges with non CA countries; intra-Central-Asian exchanges are absent. TJ 18
      sheets, 8760 h demand North/South (2021), sheet Exchanges: CASA-1000 DC link 300
      MW from 2026 with a May-September export window, TJ to AF Sangtuda-Kunduz 300
      MW, existing PPA 188 MW; no detail on Rogun. TM 13 sheets, no hydro, and
      DEGRADED DEMAND: average day per month only (~288 points), with no regional
      breakdown. UZ 19 sheets, 8760 h demand over 5 zones, sheet Fuel Availability
      unique among the five books.

  uz_climate_2026:
    name: UZ Climate AssumptionBook (WB/MAI)
    date: 2026-07-09
    access: internal_wb
    where: data_collection/Mercados/20260709_UZ_CC_AssumptionBook_WB_MAI.xlsb
    covers: [UZB]
    note: >
      Sixteen months later than the V5.1 books, hence takes precedence over them for
      UZB. Format .xlsb, read through pyxlsb.

  gabarit_2026:
    name: 2026 template, CASA CENTRAL ASIA DATA REQUEST
    date: 2026
    access: internal_wb
    where: Context/opening_emails/
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      25 sheets (5 themes x 5 countries), ALREADY PRE-FILLED with the cleaned 2020
      data, zones as free-text labels. This is the official validation channel through
      the country TTLs. Pre-filled is not validated. Covers NEITHER Afghanistan NOR
      Pakistan.

  ttl_2026:
    name: Country feedback from the TTL team, 2026 campaign
    date: 2026
    access: internal_wb
    covers: [KAZ, KGZ, TAJ, TUR, UZB]
    note: >
      Takes precedence over DeCA and over the 2020 model where available. Fleet
      additions dated 2023+ inherited from 2020 are PROJECTS, not facts: TTL review is
      mandatory before keeping them.

  casa1000_ppa:
    name: CASA_PPA_Quantities_All_4_Flows.xlsx
    date: 2026
    access: client_confidential
    where: (to be located)
    covers: [AFG, KGZ, PAK, TAJ]
    note: Contractual quantities of the 4 flows, to be attached to pContractedTradeEnergy.

  epmresults_legacy:
    name: EPMRESULTS.xlsx, results of the legacy model
    date: 2020
    access: internal_wb
    where: planning_sharefolder/casa_planning_sharefolder/CASA/1. Model/
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: Non-regression reference for the port. A warning signal, not an acceptance criterion.

  pak_sharefolder:
    name: Pakistan planning sharefolder
    date: 2018
    access: internal_wb
    where: planning_sharefolder/pakistan_planning_sharefolder/
    covers: [PAK]
    note: >
      NTDC, Lahmeyer, SNC Lavalin master plan. MAJOR GAP: 8 years old, IGCEP missing,
      while Pakistan weighs 155 TWh, that is 38 % of the demand of the model.

  afg_sharefolder:
    name: Afghanistan planning sharefolder
    date: 2021
    access: internal_wb
    where: planning_sharefolder/afghanistan_planning_sharefolder/
    covers: [AFG]
    note: >
      AFGDISPATCH.gms and .xlsx. MAJOR GAP: earlier than 2021, no reliable alternative
      source outside Global Energy Monitor.

  mercados_plexos:
    name: Mercados report and the associated PLEXOS model
    date: 2025
    access: internal_wb
    covers: [KAZ, KGZ, TAJ, TUR, UZB]

  renewables_ninja:
    name: Renewables.ninja / ERA5
    date: 2026
    access: open_source
    where: renewables.ninja
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Hourly solar and wind profiles by coordinates. Already used by
      pre-analysis/pipelines/vre_pipeline.py.

  demande_tso:
    name: Direct request to the transmission system operators
    date: 2026
    access: internal_wb
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: NTCs and commissioning schedules of the corridors. Not started to date.

  pipeline:
    name: Output of the pre-analysis pipeline (representative days, VRE profiles)
    date: 2026
    access: internal_wb
    where: EPM/pre-analysis/
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]

  equipe:
    name: Modelling team decision
    date: 2026
    access: internal_wb
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]

  hypothese:
    name: NO SOURCE - assumption made
    date: 2026
    access: assumption
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      To be made explicit in the methodology note: every value carried here is to be
      justified or replaced.

  courriels_equipe:
    name: CASA team emails
    date: 2026-08
    access: internal_wb
    where: Context/opening_emails/
    covers: [AFG, KAZ, KGZ, PAK, TAJ, TUR, UZB]
    note: >
      Mandated validation channel: Mercados, then template, then TTL review, then EPM.
      INTERNAL exercise, not to be shared externally (Kabir Malik, 5 August 2026).


# -- Leads on public sources, tested on 19 August 2026 -------------------------
# Purely informative: this block does not drive the build, it feeds the workbook.
# It lists only sources ACCESSIBLE ONLINE, without a prior request, and the status
# says what the test returned, not what we hoped to find there.
# [country, organisation, address, status, what was found, what we do with it]

leads:
  - [Pakistan, "NTDC / ISMO - IGCEP 2025-35", "nepra.org.pk/Admission Notices/2025/08 Aug/IGCEP_2025-35_R2.pdf", "TESTED - AVAILABLE", "Free 320-page PDF, May 2025: demand in 3 scenarios out to 2035 (GWh and MW), fleet unit by unit, candidates dated and costed, efficiencies, load factors. 43,069 MW in 2024, 64,035 MW targeted in 2035.", "PRIORITY 1. Replaces the 2018 sharefolder on its own. Two treatments needed: extend 2035 to 2050, and write the mapping from the 11 DISCOs to our 3 PAK zones."]
  - [Pakistan, "NTDC - IGCEP 2024-34", "nepra.org.pk/Admission Notices/2024/05 May/IGCEP 2024-34 Report.pdf", "TESTED - AVAILABLE", "239 pages, April 2024. Annex A consumption by category, annex B fleet as of 30 June 2023 and candidate costs, annexes C-F demand scenarios.", "Control vintage: the gap between the two editions reveals the schedule slippage of the large dams."]
  - [Pakistan, "NEPRA - State of Industry Report 2025", nepra.org.pk/publications, "TESTED - AVAILABLE", "Annual review, published January 2026: actual generation, losses by distributor, collection, tariffs.", "Direct source for pLossFactor and calibration of the observed year."]
  - [Kazakhstan, "KEGOC - integrated annual reports", "ar2024.kegoc.kz, ar2023.kegoc.kz", "TESTED - AVAILABLE", "Electricity balance and PEAK BROKEN DOWN BY ZONE North/South/West, exactly our split. Peak of 27/12/2025 at 18h: 17,540 MW (N 10,645, S 4,403, W 2,492). Consumption 2025: 124,606.5 GWh.", "EXTERNAL VALIDATION ALREADY DONE: our coincident 2026 peak comes out at 17,886 MW, that is +2.0 %, one year of growth. The only model parameter validated from the outside."]
  - [Kazakhstan, "Nodal dataset (Data in Brief, CC BY)", "pmc.ncbi.nlm.nih.gov/articles/PMC6661261", "TESTED - AVAILABLE", "193 lines 220-1150 kV with parameters, 24 load centres, nodal hourly demand over one summer week and one winter week, power plants with efficiency and availability. 2015 vintage.", "The only open nodal dataset of the region. Indispensable if a third KAZ_W zone is created; to be treated as a topology, not as a level."]
  - [Kazakhstan, "KEGOC wholesale market, Bureau of National Statistics", "kegoc.kz, stat.gov.kz", "TESTED - PARTIAL", "Market analyses H1 2025, energy balance in IEA format. No raw time series: the hourly data of the balancing market stays internal.", "Sector framing. Does not fill the need for an hourly profile."]
  - [Tajikistan, "World Bank - MPA Rogun P181029", "documents.worldbank.org", "TESTED - AVAILABLE", "Approval of 17/12/2024. Explicit phasing: 1,660 MW by 2028 (level 1,185 m), 3,780 MW in 2035 in six 630 MW units (level 1,300 m), output ~14,400 GWh/yr.", "Directly corrects the inherited fleet, which places six 600 MW units all dated 2031, an assumption disguised as a schedule. High leverage: Rogun is the largest capacity item of the model."]
  - [Tajikistan, "IEA / OECD - sector reviews", "iea.org/reports", "TESTED - AVAILABLE", "2022 sector review funded by the EU and cross-border trade roadmap: fleet, winter constraints, structure of exports.", "Qualifies Tajik seasonality, translated into pTransferLimit and hydro availability."]
  - [Tajikistan, "Barqi Tojik, Agency on Statistics", stat.tj, "TESTED - NOTHING", "No energy balance nor annual report freely downloadable. The Tajik figures in circulation all come from intermediaries.", "To go through the TTL channel. That is where the share of Sughd in national consumption would be settled."]
  - [Kyrgyzstan, "National Statistical Committee - fuel and energy balance", "stat.gov.kg/en/publications/toplivno-energeticheskij-balans", "TESTED - AVAILABLE", "Annual energy balance in Excel, layout inherited from the USSR; monthly generation and exchange data also collected.", "Sector calibration of Kyrgyz demand and independent check of the North/South split."]
  - [Kyrgyzstan, "Open Data portal", "stat.gov.kg/en/opendata", "TESTED - NOTHING", "22 categories in JSON, XML and Excel under CC BY-NC-SA 4.0, but NO energy or electricity category.", "Irrelevant to the model: the energy balance is a separate publication, outside the portal."]
  - [Uzbekistan, "stat.uz (SDMX) and data.egov.uz", "stat.uz, data.egov.uz", "TESTED - PARTIAL", "SDMX-standard portal, more than 2,000 official indicators with metadata; separate national open data portal. Energy section present.", "The best equipped technically in the region, machine access possible. The useful electricity series remain to be identified: NOT DONE."]
  - [Uzbekistan, "Energy strategy 2030 (via the IEA profile)", "iea.org/reports/uzbekistan-energy-profile", "TESTED - AVAILABLE", "Official targets: >120 TWh and 54 % renewable in 2030, 27 GW of RE. Capacity ~25.8 GW end 2025 of which 8 GW RE, generation 86.7 TWh in 2025.", "Scenario framing and upper bound on pMaxNewCapacity for RE. These are policy targets: to be treated as such."]
  - [Turkmenistan, "Turkmenenergo, state statistics", "-", "TESTED - NOTHING", "No accessible official publication. Third-party estimates only: ~7.1 GW gas-fired, ~44.8 TWh in 2024, no RE capacity in 2025.", "The DeCA TM book, degraded as it is (average day per month, no regional resolution), remains the best source. Assumptions to be made explicit in the methodology note."]
  - [Afghanistan, "DABS, NSIA, UN Energy Statistics", "unstats.un.org/unsd/energystats", "TESTED - NOTHING", "No regular statistical publication since 2021. Scattered elements: ~670 MW imported for ~280 M USD/yr according to DABS, imports of 4.6 to 5.2 TWh over 2017-2022 according to the UN, private sector overview of November 2025.", "Enough to recalibrate the LEVEL of Afghan imports, not to rebuild a zonal demand. The five NEPS zones stay as they came from the 2020 model, low confidence assumed."]
  - [Regional, "Ember - Monthly and Yearly Electricity Data", "ember-energy.org/data/monthly-electricity-data", "TESTED - AVAILABLE", "Generation by technology, demand, capacity and emissions MONTHLY for 85 geographies including our seven countries, up to April 2026. Free download.", "Four years of actuals that DeCA does not have: the history of the books stops in 2022. Base year calibration and the only homogeneous dataset over the seven countries."]
  - [Regional, "Global Energy Monitor - Global Integrated Power Tracker", "globalenergymonitor.org/projects/global-integrated-power-tracker/download-data", "TESTED - AVAILABLE", "Global fleet unit by unit, geolocated, with status and dates. AN AUGUST 2026 RELEASE IS OUT; we hold the September 2025 one.", "Immediate refresh of the fleet, and the only coverage of AFG and PAK alongside IGCEP. Tajikistan is under-represented there: complete with DeCA."]
  - [Regional, "Renewables.ninja, Global Wind Atlas, atlite/ERA5", "renewables.ninja, globalwindatlas.info", "TESTED - AVAILABLE", "Hourly solar and wind profiles simulated anywhere on the globe from the ERA5 reanalysis.", "The only route to pVREProfile in Turkmenistan, in Afghanistan and wherever DeCA gives nothing. Already wired into pre-analysis/pipelines/vre_pipeline.py."]
  - [Regional, "gridfinder, OpenStreetMap power, energydata.info", "energydata.info, gridfinder.rdrn.me", "TESTED - PARTIAL", "Global map of lines predicted from night lights and OSM (grid.gpkg, targets.tif), announced accuracy ~70 % at 1 km.", "TOPOLOGY check only: confirm that a corridor exists and where it runs. GIVES NO NTC, transfer capacities still have to be requested from the operators."]
  - [Regional, "IEA country profiles, UN Comtrade, OWID", "iea.org/countries, comtradeplus.un.org", "TESTED - PARTIAL", "National energy balances as free PDFs, electricity flows declared at customs by country pair, long consumption series.", "Cross-check of historical exchanges. Comtrade is of uneven quality in Central Asia: not to be used alone."]
  - [Regional, "CASA-1000 - project documents", "-", "NOT TESTED", "Schedule, contractual quantities, export seasonality.", "Indispensable to correct pTransferLimit and pContractedTrade."]
  - [Kyrgyzstan, "Electric Power Plants OJSC / NESK", "-", "NOT TESTED", "Generation of the Naryn cascade, level of Toktogul.", "The level of Toktogul is THE variable to watch for the winter balance."]
  - [Uzbekistan, "National Electric Grid of Uzbekistan", "-", "NOT TESTED", "Grid and regional exchanges.", "UZB is the pivot of the CAPS: it is its internal NTCs that condition any future split."]


# -- What we do, resource by resource -----------------------------------------
# path      relative path inside the deployment folder
# action    BUILD verb (keep by default): what the script does today
# work      REMAINING work, tracking vocabulary: EXTEND, FILL, REBUILD...
# priority  P1 blocking, P2 needed, P3 optional
# source    keys of the "sources" block above
# note      what was done, and why
# todo      what is left, prefixed by the phase
resources:

  # ---- Scope -------------------------------------------------------------
  y:
    path: y.csv
    group: Scope
    action: rows
    rows: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2040, 2045, 2050]
    work: EXTEND
    priority: P1
    source: ["equipe"]
    confidence: high
    what: >
      horizon 2017-2030
    note: >
      Horizon 2050. Yearly step until 2035 to follow the ramp-up of Rogun, then a
      5-year step. pWeightYear is derived from the gaps (main.gms:718).
    todo: >
      DONE (phase 1): horizon 2026-2050, yearly from 2026 to 2035 then a 5-year step
      (2040, 2045, 2050), that is 13 years. The yearly step until 2035 covers the
      ramp-up of Rogun. pWeightYear is derived automatically from the gaps
      (main.gms:718), nothing else to enter.

  zcmap:
    path: zcmap.csv
    group: Scope
    action: keep
    work: DECIDE
    priority: P1
    source: ["deca_v51"]
    confidence: high
    sheet: >
      Zones_Regions (5 countries)
    vintage: "2025"
    what: >
      16 zones -> 7 countries
    todo: >
      Keep the 16 zones. The 5 Afghan nodes are not accounting artefacts but radial
      islands, each synchronous with a different neighbour, that pTransferLimit
      interconnects progressively towards 2030: merging them would invent a capacity
      that does not exist. The only useful move is to rename them geographically.

  pSettings:
    path: pSettings.csv
    group: Scope
    action: keep
    work: REVISE
    priority: P1
    source: ["casa_2020"]
    vintage: "2020"
    what: >
      ~40 flags and scalars
    todo: >
      To be settled: carbon (OFF), storage (OFF), ramps (OFF), MinGen/MUDT (OFF),
      spinning reserve (OFF).

  config:
    path: config.csv
    group: Scope
    action: keep
    work: KEEP
    priority: P2
    source: ["casa_2020"]
    vintage: "2020"
    what: >
      modeltype RMIP + cplex options
    note: >
      Switch to MIP only if unit commitment is turned on.

  pHours:
    path: pHours.csv
    group: Scope
    action: empty
    work: REBUILD
    priority: P3
    source: ["pipeline"]
    confidence: high
    sheet: >
      DeCA Demand Profile 8760h
    vintage: "2021-2022"
    what: >
      5 seasons x 1 day x 7 blocks = 8760 h
    note: >
      q = 4 quarters, the 5th peak season is removed. It was not a structure but a
      patch: the reserve constraint takes a smax over all blocks (base.gms:991) and
      requires no dedicated season. Q5 only served to give that smax a block short
      enough to see the true peak, for want of representative days (d=1 in the 2020
      model).
    todo: >
      PHASE 8. Rebuild as 4 quarters x representative days x chronological hours,
      including a PEAK REPRESENTATIVE DAY that replaces the former Q5 season.

  pTechFuel:
    path: pTechFuel.csv
    group: Scope
    action: keep
    work: EXTEND
    priority: P2
    source: ["casa_2020"]
    vintage: "2020"
    what: >
      26 tech/fuel pairs
    todo: >
      Add BESS if storage is turned on.

  pFuelCarbonContent:
    path: pFuelCarbonContent.csv
    group: Scope
    action: keep
    work: KEEP
    priority: P3
    source: ["casa_2020"]
    vintage: "2020"
    what: >
      CO2 factors by fuel
    note: >
      Standard values, no reason to move them.


  # ---- Demand ------------------------------------------------------------
  pDemandData:
    path: load/pDemandData.csv
    group: Demand
    action: empty
    work: REBUILD
    priority: P2
    source: ["deca_v51", "gabarit_2026"]
    confidence: low
    sheet: >
      Demand Profile (8760h) + Demand Evolution
    vintage: "KZ 2022 / TJ 2021 / KG / UZ"
    what: >
      absolute MW by (z,q,d,y)
    note: >
      Emptied, its content depends on the choice of representative days.
    todo: >
      PHASE 8, from the hourly series aggregated in phase 2.

  pDemandForecast:
    path: load/pDemandForecast.csv
    group: Demand
    action: table
    from: extracted/pDemandForecast.csv        # produced by extract_demand.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: high
    sheet: >
      Demand Evolution + Demand Profile
    vintage: "2023-2060"
    what: >
      demand trajectory by zone, energy GWh and peak MW
    note: >
      Filled by extract_demand.py, DeCA Reference scenario. Demand Evolution covers
      2023-2060 BY COUNTRY: no extrapolation is needed for Central Asia. The intra-
      country split comes from the 8760 h profiles and stays constant over time, DeCA
      giving no regional trajectory. The zonal peak is NON COINCIDENT, as required by
      generate_demand.gms which multiplies it by the normalised profile of the zone:
      the own peak is therefore rescaled by the growth of the country peak, through
      the observed coincidence factor (KG 1.03, KZ 1.02, TJ 1.07, TM and UZ 1.00).
      Three deliberate departures, all documented in mappings/zones_demand.csv: the
      Tajik split is REVERSED with respect to the 2020 model (North 27.7 % against
      74.9 %), the Kyrgyz split too (North 63.9 % against 93.2 %), and Western
      Kazakhstan is attached to KAZ_N for want of a third zone. The peak block of the
      TJ book was in GW under a MW label: corrected by a generic guard, a peak not
      being allowed to fall below the average power. AFG and PAK have no 2026 source:
      carried over from the 2020 pDemandData and extended at their own rate, LOW
      confidence.
    todo: >
      PHASE 9. Add the DeCA Net Zero scenario as a variant. Replace AFG and PAK as
      soon as a source arrives (NTDC IGCEP first). Review the TAJ and KGZ splits with
      the TTLs: they change the unserved energy diagnosis of the 2020 model.

  pDemandProfile:
    path: load/pDemandProfile.csv
    group: Demand
    action: keep
    work: FILL
    priority: P3
    source: ["deca_v51"]
    sheet: >
      Demand Profile
    what: >
      normalised profile by (z,q,d,t)
    todo: >
      Depends on pHours -> deferred with it. Prepare the shape at HOURLY resolution as
      an intermediate, the aggregation to (q,d,t) is the last step.

  pEnergyEfficiencyFactor:
    path: load/pEnergyEfficiencyFactor.csv
    group: Demand
    action: keep
    work: SKIP
    priority: P3
    source: []
    what: >
      energy efficiency factor
    todo: >
      Only if an efficiency scenario is requested.

  sRelevant:
    path: load/sRelevant.csv
    group: Demand
    action: keep
    work: REBUILD
    priority: P3
    source: ["pipeline"]
    what: >
      day types retained
    todo: >
      Output of the representative days pipeline. Deferred with pHours.


  # ---- Fleet -------------------------------------------------------------
  pGenDataInput:
    path: supply/pGenDataInput.csv
    group: Fleet
    action: keep
    work: REPLACE
    priority: P1
    source: ["deca_v51", "gabarit_2026"]
    confidence: low
    sheet: >
      Thermal PP / Expansion / Candidates + HydroPP + Renewable PP
    vintage: "2022 base"
    what: >
      power plants: capacity, status, HR, costs
    todo: >
      PHASE 5, the big one. STRUCTURAL ANOMALY TO REOPEN: the generic candidates carry
      10000 MW buildable in KAZ, UZB, TUR, PAK and the 5 NEPS zones, but 0 MW in
      KGZ_N, KGZ_S, TAJ_N and TAJ_S (the only exception being a 200 MW CCGT at TAJ_N).
      Kyrgyzstan and Tajikistan can therefore build nothing outside named hydro
      projects, which alone explains why the winter unserved energy of TAJ_N only
      clears with Rogun. This is not an economic arbitrage of the model, it is a
      closed door.

  pAvailability:
    path: supply/pAvailabilityCustom.csv
    group: Fleet
    action: drop_column
    column: Q5
    work: REBUILD
    priority: P1
    source: ["deca_v51"]
    confidence: low
    sheet: >
      Hydro Profile + HydroPP (Inflows)
    vintage: "2022"
    what: >
      seasonal availability by plant (g x Q1..Q4)
    note: >
      Peak column removed. BEWARE, it carried a convention: 350 plants out of 403 had
      Q5=1.0 against Q1=0.85, that is full availability at the peak. This firm
      capacity assumption disappears and has to be reintroduced.
    todo: >
      PHASE 4. Rebuild from the monthly inflows of deca_v51 (Hydro Profile + HydroPP
      Inflows), and reintroduce firm peak capacity, either through the peak
      representative day or through pCapacityCreditPeakSeason.

  pAvailabilityDefault:
    path: supply/pAvailabilityDefault.csv
    group: Fleet
    action: keep
    work: FILL
    priority: P2
    source: ["hypothese"]
    what: >
      default availability (z,tech,fuel)
    todo: >
      DeCA does NOT give the forced outage rates of the thermal fleet, and the
      GenAvailability sheet of the template is empty.

  pGenDataInputDefault:
    path: supply/pGenDataInputDefault.csv
    group: Fleet
    action: keep
    work: FILL
    priority: P1
    source: ["deca_v51"]
    sheet: >
      PP Candidates + RenewableMaxEntry
    vintage: "2025"
    what: >
      generic candidates by zone
    todo: >
      Determines what the model is ALLOWED to build. Empty today: expansion is driven
      by pGenDataInput alone.

  pVREProfile:
    path: supply/pVREProfile.csv
    group: Fleet
    action: empty
    work: REBUILD
    priority: P3
    source: ["deca_v51", "renewables_ninja"]
    confidence: low
    sheet: >
      RenewableProfile (monthly)
