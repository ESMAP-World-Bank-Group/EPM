  pVREProfile:
    path: supply/pVREProfile.csv
    group: Fleet
    action: table
    from: extracted/pVREProfile.csv            # produced by build_vre.py
    work: DONE
    priority: P2
    source: ["deca_v51", "casa_2020"]
    confidence: medium
    sheet: >
      RenewableProfile, monthly utilization factors
    vintage: "2025 level / 2020 shape"
    what: >
      solar and wind production by (z,tech,q,d,t), as a fraction of capacity
    note: >
      PHASE 8 BUILT IT FROM TWO SOURCES BECAUSE NEITHER GIVES BOTH HALVES. base.gms:812
      writes the output of every solar and wind unit as this profile times the
      availability times the capacity, so the table is the whole renewable production,
      in level as much as in shape.
      DeCA GIVES THE LEVEL AND NOT THE SHAPE: RenewableProfile states a monthly
      utilization factor per plant and no hour of the day. Its own header says so, in a
      line the authors left for themselves, "Hourly profiles are also needed for all WPP
      and SPP power plants". THE 2020 MODEL GIVES THE SHAPE and a level five years old.
      So the day shape comes from the 2020 profile, normalised to a mean of one, and is
      multiplied by the DeCA seasonal factor, the month length weighted mean over the
      months of the season and over the plants mappings/vre_profiles.csv selects.
      THE FACTOR IS A COUNTRY MEAN over every plant of the technology, existing and
      candidate, high yield and low yield sites together, because the five books name no
      zone for their existing plants. That is an average site, which is what a generic
      candidate is. Eighty of the 160 seasonal factors move; the Afghan and Pakistani
      zones keep their 2020 level, being outside the DeCA perimeter.
      WHAT MOVES: mean solar capacity factor 0.174 to 0.169, mean wind 0.333 to 0.369.
      Solar loses most in winter, KAZ_N Q1 going from 0.144 to 0.089, which matters in a
      system that peaks in December.
      THE 2020 SHAPE IS DRAWN BY MONTHS, NOT BY NAME, since phase 4 split the summer.
      Both halves take the 2020 Q3 day and are rescaled to their own DeCA factor, 0.208
      for KAZ_N solar in Q3 against 0.207 in Q5. Matching on the name instead handed
      July-September the 2020 peak block, a 130 h winter artefact, and produced a
      capacity factor of 1.24; the column that says which season feeds which lives in
      mappings/seasons_months.csv.
      TWO TRAPS THE MAPPING STEPS AROUND. The Tajik book labels its own regions with a
      KZ prefix, Khatlon and Sougd and Gorno-Badakhshan all reading "KZ ...", so the
      selection keys on the workbook and not on the name. And one Kazakh SOLAR plant is
      named Arm Wind: the exclude column of the mapping settles it on the _SP suffix,
      and the builder refuses outright any row two technologies claim at once.
    todo: >
      EVERY REPRESENTATIVE DAY OF A SEASON CARRIES THE SAME RENEWABLE DAY, because a
      monthly factor holds no day to day variation. There is no cloudy day and no calm
      day in this model, only an average one, which understates the backup a large
      renewable fleet needs. It costs little today, the VRE fleet being small, and it
      becomes the binding weakness of the time structure as soon as the model starts
      building solar and wind at scale. The repair is an hourly renewable source,
      Renewables.ninja or the ERA5 reanalysis, clustered on the same representative days
      as the demand.

  pCapexTrajectoriesCustom:
    path: supply/pCapexTrajectoriesCustom.csv
    group: Fleet
    action: keep
    work: FILL
