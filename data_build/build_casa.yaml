  # ---- Constraints -------------------------------------------------------
  pCarbonPrice:
    path: constraint/pCarbonPrice.csv
    group: Constraints
    action: keep
    work: DECIDE
    priority: P2
    source: ["casa_2020"]
    vintage: "2020"
    what: >
      carbon price 32 -> 50 $/t
    todo: >
      DATA PRESENT BUT INACTIVE (fEnableCarbonPrice = 0). Turning it on is the
      cheapest lever to correct the 17 GW of new coal in Kazakhstan.
      PHASE 6.4 LEFT IT ALONE, ON PURPOSE, but it carries the same 2030 cliff as the
      fuel limits did: the series runs 2017 to 2030 and main.gms reads it year by
      year, so switching the flag on today would price carbon at 50 $/t to 2030 and
      at nothing whatever afterwards, which is worse than not pricing it at all. It
      has to be extended to 2050 in the same movement as it is enabled, and that is
      phase 9 with the scenarios, alongside the emission caps above and the CCS
      candidates DeCA prices and this model does not carry.

  pEmissionsCountry:
    path: constraint/pEmissionsCountry.csv
    group: Constraints
    action: keep
    work: FILL
    priority: P2
    source: ["deca_v51"]
    sheet: >
      Emissions
    vintage: "2030-2060"
    what: >
      CO2 cap by country, tons
    note: >
      PHASE 6.4 PREPARED BUT DELIBERATELY NOT WIRED IN. The file stays empty and
      fApplyCountryCo2Constraint stays 0. build_constraints.py writes the DeCA path
      out to extracted/pEmissionsCountry_netzero.csv, on the horizon and in the tons
      EPM counts in, so that phase 9 can switch it on in one line once three things
      are settled.
      The path itself: the first Net Zero row of each Emissions sheet, five books of
      the seven countries, held flat before the first year it states and interpolated
      between the years it does. Kazakhstan 93.1 MtCO2-eq in 2030 to 4.66 in 2050,
      Uzbekistan 63.3 to 3.16, Turkmenistan 16.3 to 0.82, Tajikistan 4.17 to 0.21,
      Kyrgyzstan 1.36 to 0.068. Each is built by DeCA off the country NDC and then
      run down to a residual by 2060, and each book states its own arithmetic:
      Kazakhstan takes a third of the 1990 heat and power sector, Turkmenistan
      0.85 of energy times 0.36 of electricity and heat, and so on. THE UZ BOOK
      STATES THE PATH TWICE, once economy-wide and once for electricity and heat at
      three tenths of it, and it is the sector row that is read.
      WHY IT IS NOT A BASELINE. It is a scenario, DeCA says so, and dropping it into
      the reference case would silently make the reference case a net zero case.
    todo: >
      PHASE 9, THE THREE THINGS TO SETTLE BEFORE THIS BECOMES A CONSTRAINT.
      1. SCOPE. The path covers ELECTRICITY AND HEAT and EPM carries no heat. In
      Kazakhstan heat was 87.1 of the 112.4 MtCO2-eq the sector emitted in 1990, so
      a heat and power cap read onto a power only model is loose by a factor nobody
      has measured, and the Kazakh CHPs sit on both sides of that line.
      2. COVERAGE. base.gms:1253 writes eEmissionsCountry for EVERY country at once
      when the flag is on, and a country absent from the table gets a cap of zero,
      softened only by the penalised backstop. Pakistan and Afghanistan have no NDC
      path in these books, so switching the flag on with this file as it stands
      would order them to emit nothing. Either they get a path of their own or the
      constraint has to be written for a subset.
      3. THE FIRST FOUR YEARS. Nothing is stated before 2030, so the path is held
      flat backwards to 2026, which binds four years earlier than any NDC intended.
      Harmless while the cap is loose, not harmless if it is tight.

  pEmissionsTotal:
    path: constraint/pEmissionsTotal.csv
    group: Constraints
    action: keep
    work: DECIDE
    priority: P3
    source: []
    what: >
      system-wide CO2 cap, tons
    todo: >
      PHASE 9. Empty, and fApplySystemCo2Constraint is 0. A regional cap over seven
      countries five of which have separate national NDCs is a different scenario
      from the national caps in pEmissionsCountry, not a complement to them: it
      would let Kazakh coal buy its way out on a Kyrgyz margin. To be chosen against
      the country caps rather than filled in beside them.

  pMaxFuellimit:
    path: constraint/pMaxFuellimit.csv
    group: Constraints
    action: table
    from: extracted/pMaxFuellimit.csv    # produced by build_constraints.py
    work: DONE
    priority: P2
    source: ["casa_2020"]
    vintage: "2020 series, carried to 2050"
    what: >
      supply limit by country and fuel, million MMBtu
    note: >
      PHASE 6.4 done, and it is the same defect as the fuel prices. The table ran
      2017 to 2030 against a horizon that runs 2026 to 2050, and base.gms:817
      writes the constraint only where the value is strictly positive, so PAST 2030
      EVERY LIMIT SIMPLY VANISHED while fApplyFuelConstraint stayed on. Nothing
      crashed, which is what made it dangerous.
      Rebuilt by build_constraints.py from mappings/fuel_limits.csv, which carries
      the nine rows of the two tables one by one. All five country rows are the
      2020 series held flat past its last year: DeCA states a national fuel
      availability nowhere, Pakistan and Afghanistan are outside its perimeter, and
      an assumption of no further change is at least visible where a silent zero
      was not.
      THE UZBEK COAL LINE IS THE ONE PLACE DeCA COULD HAVE SPOKEN AND IS NOT USED.
      Its Fuel Availability sheet states coal for power in M m3, a VOLUME, and
      turning that into MMBtu would need a density and a calorific value the book
      never states, which is exactly the assumption phase 6 spent its time removing
      from the coal prices. The 2020 series is held flat instead, and the gap is
      written down rather than papered over with two invented conversion factors.
    todo: >
      PHASE 6.4, WHAT RESTS ON 2020. Pakistani gas and LNG both do, and both want
      the NTDC IGCEP: indigenous Pakistani gas is on a declining path that a flat
      line does not represent, and the LNG row is a regasification terminal limit
      rather than a resource one, so holding it flat quietly forbids any new
      terminal. Kyrgyz and Tajik gas are import contracts of the 2020 model, neither
      of them binding. Uzbek coal is discussed in the note.

  pMaxFuellimitZone:
    path: constraint/pMaxFuellimitZone.csv
    group: Constraints
    action: table
    from: extracted/pMaxFuellimitZone.csv    # produced by build_constraints.py
    work: DONE
    priority: P2
    source: ["deca_v51", "casa_2020"]
    sheet: >
      UZ > Fuel Availability
    vintage: "2022-2030 stated, held to 2050"
    what: >
      supply limit by zone and fuel, million MMBtu
    note: >
      PHASE 6.4 done. Same repair as the country table, carried to 2050 by
      build_constraints.py, and one of the four rows genuinely moves.
      UZBEK GAS FOR POWER FALLS BY A THIRD. The UZ Fuel Availability sheet is the
      only one of the five books to exist, and it states 12.1 bcm available for
      electricity production, sourced to the Concept Note for ensuring electricity
      supply in Uzbekistan in 2020-2030, with the book saying in as many words that
      it holds that limit to 2060. At 36 million MMBtu per bcm, which is the BP
      conversion and the only one this step makes, that is 435.6 against the 667.6
      the 2020 model allowed, and the sheet shows why: Uzbek gas production does
      rise to 2030, 51.7 to 66.1 bcm, but domestic demand rises faster and exports
      have already been cut to zero, so power gets less of a bigger pie. The 2026 to
      2029 values interpolate between the 12.7 bcm stated for 2025 and the 12.1 of
      2030 rather than jumping. THIS WILL STRUCTURE THE UZBEK EXPANSION, roughly
      36 TWh at a modern combined cycle where the fleet needs more.
      The three other zone rows are the 2020 series held flat, Pakistani coal being
      outside the DeCA perimeter and Kazakh gas being the decision below.
    todo: >
      PHASE 6.4, THE DECISION OF THE PHASE, and it is left to the team rather than
      taken here. KAZ_N Gas = 0.1 million MMBtu is not a limit, it is a statement
      that NORTHERN KAZAKHSTAN HAS NO GAS AT ALL, and it is what forces the coal
      expansion there: no gas candidate can run whatever the carbon price, so the
      only thermal answer to Kazakh load growth is more coal. The assumption was
      defensible in 2020. It is doubtful in 2026, the Saryarka pipeline having
      reached Nur-Sultan in 2019 and Kokshetau since, and DeCA'S OWN KZ TRANSPORT
      TABLE QUOTES A DELIVERED GAS PRICE IN AKMOLA, 13.3 $/MMBtu on top of the
      commodity, which is a strange thing to state for a region where no gas can
      arrive. Raising it needs the Saryarka throughput and the volumes already
      committed to heat and industry, and it is the single most consequential
      unresolved number left in this model. Kept as it stands until then, so that
      it is a decision and not a drift.

  pMaxGenerationByFuel:
    path: constraint/pMaxGenerationByFuel.csv
    group: Constraints
    action: keep
    work: SKIP
    priority: P3
    source: []
    what: >
      max share by fuel
    note: >
      PHASE 6.4 checked, still empty and still out of scope. Its header runs z, tech,
      f, 2025, 2040 and it would cap the generation of a fuel in a zone. Nothing in
      DeCA is stated in that form, and the two things it would be used for are
      already carried elsewhere: the physical availability of a fuel by
      pMaxFuellimitZone, and any policy share by the emission caps.


  # ---- Reserves ----------------------------------------------------------
  pPlanningReserveMarginZone:
    path: reserve/pPlanningReserveMarginZone.csv
    group: Reserves
    action: keep
    work: DECIDE
    priority: P2
    source: ["assumed", "team"]
    vintage: "2020"
    what: >
      reserve margin, 15 % on each of the 16 zones
    note: >
      PHASE 7 examined, and the 0.15 does not move. What moved is what it is applied
      to, and the change is large enough that it has to be written down.
      THE 2020 MODEL VALUED FIRM CAPACITY AT NAMEPLATE. base.gms:1005 counts the firm
      capacity of a zone at the availability of each unit IN THE FLAGGED SEASON alone,
      and the 2020 model flagged an artificial peak season in which 267 units out of
      403 carried 1.0, and 313 were worth more than in Q1. That season was an artefact
      of the old time slicing and phase 1 removed it, so the flag now points at Q1,
      where those same units carry their true 0.85. A coal CHP is no longer worth its
      nameplate at the winter peak.
      WHAT IT COSTS, measured by data_build/check_reserve.py against the DeCA peaks:
      in 2026 the region has to find some 11 GW MORE firm capacity than the same
      model would have asked for under the 2020 convention. Kazakhstan 2.2 GW,
      Pakistan 4.8, Uzbekistan 2.1, Kyrgyzstan 0.6, Turkmenistan 0.9, Tajikistan 0.5.
      THE NEW CONVENTION IS THE RIGHT ONE and that is why it is kept: a planning
      margin belongs on top of DERATED capacity, and a 15 per cent margin over
      nameplate is not a margin at all once forced outages are counted, it is roughly
      zero. The model is now tighter than the 2020 reference and will build more firm
      plant. That is a real change in the results and not an accounting detail.
      The margin is uniform across sixteen zones with no source behind it. DeCA states
      none: the five books carry no reserve margin, no loss of load expectation and
      no capacity credit of any kind.
    todo: >
      PHASE 7, WHAT IS LEFT TO DECIDE, and it is a team call rather than a data gap.
      1. THE 0.15 ITSELF has no source. It is defensible as a placeholder, it is not
      defensible in a published result, and the same number is applied to a Pakistani
      zone with a thermal fleet and a Kyrgyz zone that is nearly all hydro. The
      national regulators are the source to ask for.
      2. THE 0.85 UNDER IT is inherited too, and the two multiply: the requirement is
      really 1.15 / 0.85 = 1.35 times the peak in nameplate terms. Whether the thermal
      fleet of the region is available 85 or 90 per cent of the time is worth one
      question to the TTLs, because it moves the answer by 4 GW in 2026.
      3. SOLAR IS VALUED AT ITS BEST HOUR OF Q1 (main.gms:700), which for a system
      whose winter peak is in the evening is generous. Nothing depends on it yet, the
      VRE candidates being small, but it should be reviewed before the capacity mix is
      published.

  pReserveSeasonFlag:
    path: reserve/pReserveSeasonFlag.csv
    group: Reserves
    action: rows
    rows: [["Q1", 1]]
    work: REBUILD
    priority: P1
    source: ["team"]
    confidence: high
    what: >
      peak season = Q5
    note: >
      Follows the removal of the peak season. This flag only serves to choose the
      season whose NTC is used for firm capacity sharing (base.gms:1005); it does not
      size the reserve, which goes through a smax over all blocks.
    todo: >
      DONE (phase 1): Q5 -> Q1. This flag serves one purpose only (base.gms:1005):
      choosing the season whose NTC is used for firm capacity sharing between zones.
      It does NOT drive the sizing of the reserve, which goes through a smax over all
      blocks. Q1 = winter quarter, correct.
      DONE (phase 7): the check this todo owed is made, and the answer is that the
      credit does fall from 1.0 to 0.85 and that it is kept there. Some 11 GW more
      firm capacity is asked of the region in 2026 as a result. The reasoning is in
      pPlanningReserveMarginZone, where it belongs; Q1 stays flagged.

  pPlanningReserveMargin:
    path: reserve/pPlanningReserveMargin.csv
    group: Reserves
    action: keep
    work: SKIP
    priority: P3
    source: []
    what: >
      margin by country
    note: >
      PHASE 7 checked, deliberately left empty. It is not redundant, it is the
      ALTERNATIVE: base.gms:1017 says a study that switches the zonal reserve on will
      normally leave this one empty, otherwise both apply at once and the zones are
      held to their own margin and to their country's. Empty here is what keeps the
      country equation from generating any row, since it is guarded by the margin
      itself and not by the flag, which is on.
      Pooling reserves by country rather than by zone would be a defensible variant
      for Kazakhstan and Kyrgyzstan, whose two zones are strongly connected; it would
      relax the model. It is a scenario, not a correction.

  pSpinningReserveReqCountry:
    path: reserve/pSpinningReserveReqCountry.csv
    group: Reserves
    action: keep
    work: KEEP
    priority: P3
    source: ["deca_v51", "casa_2020"]
    sheet: >
      Thermal PP, column Operating Reserve
    what: >
      spinning reserve by country
    note: >
      PHASE 7 checked and left empty and off, and this is now a sourced decision
      rather than an omission. Every one of the five books carries an Operating
      Reserve column on its Thermal PP sheet, and IT IS ZERO ON ALL 112 UNITS THAT
      FILL IT, the UZ book leaving it blank altogether: the reference study holds no
      spinning reserve on its thermal fleet either. fApplyCountrySpinReserveConstraint
      and fApplySystemSpinReserveConstraint stay at 0.
      Turning it on is expensive for what it buys: the comment at base.gms:950 says
      the country equation multiplies solving time by three, and the model would need
      a ResLimShare per unit that nothing in the sources supports. The right place for
      an operating reserve in this study is the hourly dispatch run of phase 8, not
      the expansion.

  pSpinningReserveReqSystem:
    path: reserve/pSpinningReserveReqSystem.csv
    group: Reserves
    action: keep
    work: KEEP
    priority: P3
    source: ["deca_v51", "casa_2020"]
    what: >
      system-wide spinning reserve
    note: >
      PHASE 7, same decision and same reason as pSpinningReserveReqCountry: empty and
      off, DeCA holding no operating reserve either. A regional spinning reserve over
      seven countries that do not share a control area would in any case be a strong
      assumption about market integration, which is the subject of the study rather
      than an input to it.


