  pDemandForecast:
    path: load/pDemandForecast.csv
    group: Demand
    action: table
    from: extracted/pDemandForecast.csv        # produced by extract_demand.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: high
    sheet: >
      Demand Evolution + Demand Profile
    vintage: "2023-2060"
    what: >
      demand trajectory by zone, energy GWh and peak MW
    note: >
      Filled by extract_demand.py, DeCA Reference scenario. Demand Evolution covers
      2023-2060 BY COUNTRY: no extrapolation is needed for Central Asia. The intra-
      country split comes from the 8760 h profiles and stays constant over time, DeCA
      giving no regional trajectory. The zonal peak is NON COINCIDENT, as required by
      generate_demand.gms which multiplies it by the normalised profile of the zone:
      the own peak is therefore rescaled by the growth of the country peak, through
      the observed coincidence factor (KG 1.03, KZ 1.02, TJ 1.07, TM and UZ 1.00).
      Three deliberate departures, all documented in mappings/zones_demand.csv: the
      Tajik split is REVERSED with respect to the 2020 model (North 27.7 % against
      74.9 %), the Kyrgyz split too (North 63.9 % against 93.2 %), and Western
      Kazakhstan is OUT OF PERIMETER. The West (Atyrau, Mangystau) is a gas island
      synchronous with Russia, unable to trade with CAPS; the 2020 model folded its
      load into KAZ_N without its plants, which overstated the tightness of the North.
      It keeps its 12.9 % share of the national energy so that the North and the South
      are not inflated by it, and is dropped from the output: the KZ split is KAZ_N
      64.4 %, KAZ_S 22.7 %, out of perimeter 12.9 %. Modelled Kazakhstan is North plus
      South, about 87 % of national consumption, which is what the results must be
      read against. The peak block of the
      TJ book was in GW under a MW label: corrected by a generic guard, a peak not
      being allowed to fall below the average power. AFG and PAK have no 2026 source:
      carried over from the 2020 pDemandData and extended at their own rate, LOW
      confidence.
    todo: >
      PHASE 9. Add the DeCA Net Zero scenario as a variant. Replace AFG and PAK as
      soon as a source arrives (NTDC IGCEP first). Review the TAJ and KGZ splits with
      the TTLs: they change the unserved energy diagnosis of the 2020 model.

  pDemandProfile:
    path: load/pDemandProfile.csv
    group: Demand
    action: table
    from: extracted/pDemandProfile.csv         # produced by build_demand.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: high
    sheet: >
      Demand Profile (8760 h)
    vintage: "KZ 2022 / TJ 2021 / KG / UZ"
    what: >
      normalised load shape by (z,q,d,t), maximum 1
    note: >
      PHASE 8 FILLED IT, AND IT IS WHAT MAKES THE MODEL RUNNABLE. Until this step both
      pDemandData and pDemandProfile were empty, every zone was dead and nothing could
      be solved.
      EIGHT ZONES READ THEIR OWN 8760 HOURS, the series extract_demand.py aggregated in
      phase 2: the two Kazakh zones, the two Kyrgyz, the two Tajik, Turkmenistan and
      Uzbekistan. Turkmenistan states one average day per month, 288 points, expanded
      over the days of each month; the zone is single and only its shape is used.
      EIGHT ZONES READ THE 2020 MODEL, the five Afghan ones and the three Pakistani
      ones, DeCA covering neither country. Their blocks are chronological hour of day
      groups and not a load duration curve, which the 2020 pVREProfile proves on its
      own: solar reads zero in the first and the last block and peaks in the middle
      one. The widths are read off the 2020 pHours, 6-5-3-3-4-3 hours, and each block is
      held flat over its own hours. Those zones have one shape per season and no day to
      day variation; their peak day is lifted by the ratio the old peak season carried
      over their seasonal days, which is the one piece of peak information it held.
      THE PEAK DAY OF EACH SEASON IS CHOSEN ON THE EIGHT SOURCED ZONES ALONE. Pakistan
      is a large share of the demand of the model and cannot vote on it, so the
      coincidence between Central Asia and Pakistan is inherited from the 2020 shapes
      rather than modelled.
      THE PROFILE IS NORMALISED TO A MAXIMUM OF EXACTLY 1, which is what
      generate_demand.gms expects: with fUseSimplifiedDemand at 1 it multiplies the
      profile by the peak of pDemandForecast, then adds a correction proportional to
      (max - profile) until the annual energy matches, a correction that is null at the
      peak. The peak of the profile is therefore the peak of the forecast, and the shape
      carries the rest. pDemandData stays empty on purpose: the year by year scaling is
      the work of the model, not of the pipeline.
      THE OTHER DAYS ARE REAL DAYS TOO, WHICH THEY WERE NOT AT FIRST. Each group was
      first represented by the average of its days, and averaging seventy-six days
      flattens every trough that does not fall at the same hour twice. The model does
      not read that flattening as a flat shape, it reads it as a baseload the system
      does not have: the load factor of northern Tajikistan came out at 0.715 where its
      own series shows 0.600, and generate_demand.gms, which is handed both the peak and
      the energy of the zone and has to make the shape fit both, took the excess out of
      the nights and left TAJ_S at three per cent of its peak at four in the morning,
      under a smelter that never stops. Each group is now represented by its medoid, the
      real day closest to the average of the group, and the number of days it stands for
      is solved so that the energy of the season comes out right: two unknowns, the
      count of days and the energy, two equations. Nothing else changed, the structure
      is still 4 x 3 x 24.
      THE PEAK DAY IS CHOSEN ON THE STRESS OF EVERY ZONE, NOT ON THE MEGAWATTS. Summed
      in MW the peak day of a season is decided by Kazakhstan and Uzbekistan alone, and
      on the days that won southern Tajikistan sat at 78 per cent of its own maximum and
      Turkmenistan at 91. The planning reserve of EPM is written per zone, so those two
      would have been sized against a peak the model never sees. Each zone is divided by
      its own maximum before the sum, which gives every zone one vote. Energy is still
      counted in megawatts: that question is about size, this one is not.
      AND EACH ZONE IS LIFTED ONTO ITS OWN MAXIMUM. One day per season is shared by
      sixteen zones, so no single day is the day on which each of them separately peaks;
      northern Tajikistan still only reached 84 per cent of its own. The peak days are
      therefore multiplied, one factor per zone, until the highest hour of the profile
      is the highest hour of the series, 1.185 for TAJ_N and 1.05 or less for six of the
      eight. It is an assumption about coincidence, it is reported per zone as
      peak_uplift, and it is the same convention the 2020 model already used for
      Afghanistan and Pakistan, applied here to measured data instead of an inherited
      one.
      THE BUILD NOW TESTS ITSELF, which is the point of the table above. Twelve days are
      asked to stand for three hundred and sixty five and nothing in the model would
      ever have said how well they do it, so build_demand.py measures it against the
      series the days were drawn from and writes the answer beside them: the load factor
      the twelve days produce against the one the year really has, the annual energy,
      and the largest gap between the two load duration curves read at every five per
      cent of the year. Every sourced zone now lands within 0.02 of its true load
      factor, against 0.15 before, the annual energy is within 2.7 per cent, and the
      duration curve within 5.2 per cent of the peak. The measurement is rerun by the
      build, so the next change to this step cannot pass unnoticed.
    check:
      from: extracted/demand_zone_report.csv
      note: >
        Written by build_demand.py. The last three columns compare the twelve
        representative days against the 8760 hours they were drawn from; a zone with no
        hourly series has nothing to be compared against and its columns are empty.
    todo: >
      TURKMENISTAN IS THE ONE ZONE LEFT WHERE THE PROFILE AND THE FORECAST DISAGREE,
      0.693 against 0.815, and the disagreement is inside DeCA rather than in this step:
      the TM book states one average day per month, 288 points and no day to day
      variation at all, so the shape cannot show the peak the Demand Evolution sheet
      implies. The simplified demand routine absorbs it by raising the nights of
      Turkmenistan some 40 per cent above what the profile says. ASK THE TM SOURCE for
      an hourly series, or fall back on Renewables.ninja for the shape.
      A NOTE ON WHAT IS NOW SETTLED, since it was written here as an open question and
      it was wrong: the Tajik profiles do not disagree with the Tajik forecast. Measured
      against the 8760 hour series, DeCA agrees with itself to within 0.02 of load
      factor on both zones. The gap of 0.15 recorded here earlier was made by this
      pipeline, by averaging days, and it is gone.
      No day to day variation for Afghanistan and Pakistan. The NTDC IGCEP would replace
      the Pakistani shape, which is the largest single gap left in the demand.

