  pDemandForecast:
    path: load/pDemandForecast.csv
    group: Demand
    action: table
    from: extracted/pDemandForecast.csv        # produced by extract_demand.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: high
    sheet: >
      Demand Evolution + Demand Profile
    vintage: "2023-2060"
    what: >
      demand trajectory by zone, energy GWh and peak MW
    note: >
      Filled by extract_demand.py, DeCA Reference scenario. Demand Evolution covers
      2023-2060 BY COUNTRY: no extrapolation is needed for Central Asia. The intra-
      country split comes from the 8760 h profiles and stays constant over time, DeCA
      giving no regional trajectory. The zonal peak is NON COINCIDENT, as required by
      generate_demand.gms which multiplies it by the normalised profile of the zone:
      the own peak is therefore rescaled by the growth of the country peak, through
      the observed coincidence factor (KG 1.03, KZ 1.02, TJ 1.07, TM and UZ 1.00).
      Three deliberate departures, all documented in mappings/zones_demand.csv: the
      Tajik split is REVERSED with respect to the 2020 model (North 27.7 % against
      74.9 %), the Kyrgyz split too (North 63.9 % against 93.2 %), and Western
      Kazakhstan is OUT OF PERIMETER. The West (Atyrau, Mangystau) is a gas island
      synchronous with Russia, unable to trade with CAPS; the 2020 model folded its
      load into KAZ_N without its plants, which overstated the tightness of the North.
      It keeps its 12.9 % share of the national energy so that the North and the South
      are not inflated by it, and is dropped from the output: the KZ split is KAZ_N
      64.4 %, KAZ_S 22.7 %, out of perimeter 12.9 %. Modelled Kazakhstan is North plus
      South, about 87 % of national consumption, which is what the results must be
      read against. The peak block of the
      TJ book was in GW under a MW label: corrected by a generic guard, a peak not
      being allowed to fall below the average power. AFG and PAK have no 2026 source:
      carried over from the 2020 pDemandData and extended at their own rate, LOW
      confidence.
    todo: >
      PHASE 9. Add the DeCA Net Zero scenario as a variant. Replace AFG and PAK as
      soon as a source arrives (NTDC IGCEP first). Review the TAJ and KGZ splits with
      the TTLs: they change the unserved energy diagnosis of the 2020 model.

  pDemandProfile:
    path: load/pDemandProfile.csv
    group: Demand
    action: table
    from: extracted/pDemandProfile.csv         # produced by build_demand.py
    work: DONE
    priority: P1
    source: ["deca_v51", "casa_2020"]
    confidence: high
    sheet: >
      Demand Profile (8760 h)
    vintage: "KZ 2022 / TJ 2021 / KG / UZ"
    what: >
      normalised load shape by (z,q,d,t), maximum 1
    note: >
      PHASE 8 FILLED IT, AND IT IS WHAT MAKES THE MODEL RUNNABLE. Until this step both
      pDemandData and pDemandProfile were empty, every zone was dead and nothing could
      be solved.
      EIGHT ZONES READ THEIR OWN 8760 HOURS, the series extract_demand.py aggregated in
      phase 2: the two Kazakh zones, the two Kyrgyz, the two Tajik, Turkmenistan and
      Uzbekistan. Turkmenistan states one average day per month, 288 points, expanded
      over the days of each month; the zone is single and only its shape is used.
      EIGHT ZONES READ THE 2020 MODEL, the five Afghan ones and the three Pakistani
      ones, DeCA covering neither country. Their blocks are chronological hour of day
      groups and not a load duration curve, which the 2020 pVREProfile proves on its
      own: solar reads zero in the first and the last block and peaks in the middle
      one. The widths are read off the 2020 pHours, 6-5-3-3-4-3 hours, and each block is
      held flat over its own hours. Those zones have one shape per season and no day to
      day variation; their peak day is lifted by the ratio the old peak season carried
      over their seasonal days, which is the one piece of peak information it held.
      THE PEAK DAY OF EACH SEASON IS CHOSEN ON THE EIGHT SOURCED ZONES ALONE. Pakistan
      is a large share of the demand of the model and cannot vote on it, so the
      coincidence between Central Asia and Pakistan is inherited from the 2020 shapes
      rather than modelled.
      THE PROFILE IS NORMALISED TO A MAXIMUM OF EXACTLY 1, which is what
      generate_demand.gms expects: with fUseSimplifiedDemand at 1 it multiplies the
      profile by the peak of pDemandForecast, then adds a correction proportional to
      (max - profile) until the annual energy matches, a correction that is null at the
      peak. The peak of the profile is therefore the peak of the forecast, and the shape
      carries the rest. pDemandData stays empty on purpose: the year by year scaling is
      the work of the model, not of the pipeline.
      A CROSS CHECK THAT LARGELY PASSES. The load factor implied by this profile and the
      one implied by pDemandForecast were built from different sheets of the same books
      and agree to a thousandth on eleven zones of sixteen. Three do not, and the gap is
      DeCA disagreeing with itself: see the todo.
    todo: >
      THREE ZONES WHERE THE PROFILE AND THE FORECAST DISAGREE, profile load factor
      against forecast load factor: TAJ_N 0.715 against 0.618, TAJ_S 0.675 against
      0.545, TUR 0.719 against 0.815. On the two Tajik zones the profile is flatter than
      the stated peak implies, which means the peak of pDemandForecast is high by some
      14 per cent, and the Tajik peak is precisely the one phase 2 had to repair, the TJ
      book stating it in GW under a MW label. The simplified demand routine will absorb
      the gap by digging the valleys, so nothing breaks, but the Tajik reserve
      requirement is overstated until the peak is settled. ASK THE TJ AND TM SOURCES.
      No day to day variation for Afghanistan and Pakistan. The NTDC IGCEP would replace
      the Pakistani shape, which is the largest single gap left in the demand.

