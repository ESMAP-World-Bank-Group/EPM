    what: >
      absolute MW by (z,q,d,y)
    note: >
      DELIBERATELY EMPTY, and it stays that way. Phase 8 chose the other of the two
      routes generate_demand.gms offers: pDemandProfile carries the shape, the peak and
      the energy of pDemandForecast carry the level, and the model builds pDemandData
      itself, year by year, by the NLP at generate_demand.gms:63. Writing it here would
      mean freezing thirteen years of hourly load in a csv, which is neither reviewable
      nor scenario friendly.
    todo: >
      Only if a study needs a load shape that changes with the year, which nothing in
